<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SBI Daily Report — Koraput</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<!-- Gun.js for Real-Time Chat & Emojis Across Devices -->
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
:root {
  --bg-main:       #f7f2eb;
  --bg-accent:     #efe6d8;
  --paper:         #ffffff;
  --paper-glass:   rgba(255, 255, 255, 0.86);
  --paper-subtle:  #faf7f2;

  --ink:           #261c18;
  --mute:          #7d6e65;
  --line:          #e6dacb;

  --primary:       #d95f43;
  --primary-light: rgba(217, 95, 67, 0.12);
  --gold:          #d49b3b;
  --gold-light:    rgba(212, 155, 59, 0.15);
  --teal:          #3b82f6;
  --amber:         #d97706;
  --amber-bg:      #fffbeb;
  --green:         #15803d;
  --green-bg:      #f0fdf4;
  --green-border:  #86efac;
  --danger:        #e11d48;

  --card-shadow:   0 3px 0 #dfd3c3, 0 8px 20px rgba(38, 28, 24, 0.04);
  --btn-shadow:    0 3px 0 #b84329;
  --radius-sm:     10px;
  --radius-md:     16px;
  --radius-lg:     24px;
}

body.dark-theme {
  --bg-main:       #141115;
  --bg-accent:     #1e1920;
  --paper:         #211c24;
  --paper-glass:   rgba(33, 28, 36, 0.88);
  --paper-subtle:  #2a242e;

  --ink:           #f9f5f0;
  --mute:          #a3969e;
  --line:          #352e3a;

  --primary:       #ff7e67;
  --primary-light: rgba(255, 126, 103, 0.15);
  --gold:          #f5b952;
  --gold-light:    rgba(245, 185, 82, 0.15);
  --teal:          #60a5fa;
  --amber:         #fbbf24;
  --amber-bg:      rgba(251, 191, 36, 0.08);
  --green:         #34d399;
  --green-bg:      rgba(52, 211, 153, 0.1);
  --green-border:  rgba(52, 211, 153, 0.4);
  --danger:        #fb7185;

  --card-shadow:   0 3px 0 #0a080b, 0 10px 24px rgba(0, 0, 0, 0.4);
  --btn-shadow:    0 3px 0 #b54632;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html { -webkit-font-smoothing: antialiased; }
button, a, .stat-card { touch-action: manipulation; user-select: none; -webkit-user-select: none; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  color: var(--ink);
  height: 100vh; height: 100dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
  background-color: var(--bg-main);
  background-image:
    radial-gradient(circle at 10% 0%, var(--primary-light), transparent 45%),
    radial-gradient(circle at 90% 100%, var(--gold-light), transparent 45%),
    radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 22px 22px;
  transition: background-color 0.25s ease, color 0.25s ease;
}

.hidden { display: none !important; }

header {
  background: var(--paper-glass);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1.5px solid var(--line);
  padding: max(10px, env(safe-area-inset-top)) 14px 10px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100; flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; letter-spacing: -0.02em;
  box-shadow: 0 3px 10px var(--primary-light);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-weight: 800; font-size: 15px; color: var(--ink); }
.brand-sub { font-size: 10px; font-weight: 700; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; }

.header-actions { display: flex; align-items: center; gap: 8px; }
#live-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; color: var(--primary);
  background: var(--primary-light);
  padding: 5px 8px; border-radius: 8px;
}
.btn-icon {
  width: 32px; height: 32px; border-radius: 9px;
  border: 1.5px solid var(--line); background: var(--paper-subtle);
  color: var(--ink); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn-exit {
  background: var(--paper-subtle);
  border: 1.5px solid var(--line);
  color: var(--mute);
  padding: 5px 11px; border-radius: 9px;
  font: 700 11px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
}
.btn-exit:active, .btn-icon:active { transform: scale(0.94); }

#main-content {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0;
  max-width: 520px; width: 100%;
  margin: 0 auto; position: relative;
}

#login-wrapper {
  height: 100%; display: flex;
  align-items: center; justify-content: center; padding: 20px;
}
#login-page {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 28px;
  padding: 40px 26px 30px;
  text-align: center; width: 100%;
  box-shadow: var(--card-shadow);
  position: relative;
}
.auth-icon {
  width: 72px; height: 72px;
  margin: -74px auto 16px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  border: 4px solid var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 8px 20px var(--primary-light);
  transform: rotate(-4deg);
}
#login-page h1 {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 2.2rem;
  color: var(--ink);
  margin-bottom: 6px;
}
#login-page p {
  font-weight: 600; font-size: 0.9rem;
  color: var(--mute); margin-bottom: 26px;
}
.btn-main {
  width: 100%; height: 50px; border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  color: #fff; border: none;
  font: 800 15px 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  box-shadow: var(--btn-shadow);
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn-main:active { transform: translateY(3px); box-shadow: none; }

#dashboard { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.scroll-area {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 12px 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
}

.top-deck {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 8px;
  flex-shrink: 0;
}
.overview-card {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 9px 12px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--card-shadow);
}
.ov-left { display: flex; flex-direction: column; }
.ov-label { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); }
.ov-val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 1px; }
.ov-sub { font-size: 10px; font-weight: 700; color: var(--primary); }

.action-row-top { display: flex; gap: 6px; }
.chat-banner-btn {
  flex: 1;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  border: none;
  border-radius: var(--radius-md);
  padding: 9px 10px;
  color: #fff;
  font-weight: 800; font-size: 11px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s;
  white-space: nowrap;
}
.chat-banner-btn:active { transform: translateY(2px); }

.quick-link-banner {
  flex: 1;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 9px 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 800; font-size: 11px;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s;
}
.quick-link-banner:active { transform: translateY(2px); }
.quick-link-icon { color: var(--primary); display: flex; align-items: center; }
.quick-link-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.3; display: block; }

.section-header {
  font-weight: 800; font-size: 10.5px;
  color: var(--mute); letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
  margin-top: 2px;
}
.section-header::before { content: "✦"; color: var(--primary); font-size: 11px; }
.section-header::after { content: ""; flex: 1; height: 1.5px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid > div:last-child:nth-child(odd) { grid-column: 1 / -1; }

.stat-card {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 9px 11px 9px 13px;
  cursor: pointer; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; gap: 5px;
  box-shadow: var(--card-shadow);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
}
.stat-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--primary);
}
.stat-card:active { transform: translateY(2px); box-shadow: none; }

.card-top-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card-title-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
.card-title { font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-target {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 9.5px; color: var(--mute);
  background: var(--paper-subtle); border: 1px solid var(--line);
  padding: 2px 5px; border-radius: 6px; flex-shrink: 0;
}

.card-body { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1px; }
.card-count { font-family: 'JetBrains Mono', monospace; font-size: 1.65rem; font-weight: 700; color: var(--ink); line-height: 1; }
.tap-pill { font-size: 10px; font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 3px 7px; border-radius: 6px; }

.progress-track { width: 100%; height: 4px; background: var(--bg-accent); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; border-radius: 4px; }

.stat-card.mid::before, .stat-card.mid .progress-fill { background: var(--amber); }
.stat-card.mid .card-count { color: var(--amber); }
.stat-card.mid .tap-pill { color: var(--amber); background: var(--amber-bg); }

.stat-card.met { background: var(--green-bg); border-color: var(--green-border); }
.stat-card.met::before, .stat-card.met .progress-fill { background: var(--green); }
.stat-card.met .card-count { color: var(--green); }
.stat-card.met .tap-pill { color: var(--green); background: rgba(21, 128, 61, 0.12); }

.bottom-actions {
  background: var(--paper-glass);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1.5px solid var(--line);
  padding: 10px 14px max(10px, env(safe-area-inset-bottom));
  display: flex; gap: 10px; z-index: 10; flex-shrink: 0;
}
.action-btn {
  flex: 1; height: 44px; border-radius: 14px; border: none;
  font: 800 13px 'Plus Jakarta Sans', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; transition: transform 0.1s ease;
}
.action-btn:active { transform: translateY(2px); }
.action-btn.send { background: linear-gradient(135deg, var(--primary), var(--gold)); color: #fff; box-shadow: var(--btn-shadow); }
.action-btn.send:active { box-shadow: none; }
.action-btn.reset { background: var(--paper-subtle); border: 1.5px solid var(--line); color: var(--danger); flex: 0.45; }

/* CHAT */
.chat-overlay {
  position: fixed; inset: 0;
  background: rgba(20, 15, 18, 0.6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: 0.2s ease;
  z-index: 3000; display: flex; align-items: flex-end; justify-content: center;
}
.chat-overlay.show { opacity: 1; pointer-events: auto; }
.chat-sheet {
  background: var(--paper);
  border-top: 2px solid var(--line);
  border-radius: 28px 28px 0 0;
  width: 100%; max-width: 520px;
  height: 75vh; height: 75dvh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 -20px 40px rgba(0,0,0,0.3);
}
.chat-overlay.show .chat-sheet { transform: translateY(0); }
.chat-header {
  padding: 14px 18px; border-bottom: 1.5px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.chat-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); display: inline-block; transition: background 0.3s; }
.conn-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.chat-close { background: var(--paper-subtle); border: 1.5px solid var(--line); color: var(--mute); width: 28px; height: 28px; border-radius: 50%; font-weight: 800; cursor: pointer; }
.chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { background: var(--paper-subtle); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 13px; word-break: break-word; align-self: flex-start; }
.chat-msg.mine { align-self: flex-end; background: var(--primary-light); border-color: var(--primary); }
.chat-msg .time { font-size: 9.5px; color: var(--mute); margin-top: 2px; text-align: right; font-family: 'JetBrains Mono', monospace; }
.chat-footer { padding: 12px 14px max(14px, env(safe-area-inset-bottom)); border-top: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.emoji-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.emoji-btn { background: var(--paper-subtle); border: 1px solid var(--line); font-size: 16px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.emoji-btn:active { transform: scale(0.9); }
.chat-input-row { display: flex; gap: 8px; }
.chat-input { flex: 1; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg-main); color: var(--ink); padding: 0 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; outline: none; }
.chat-input:focus { border-color: var(--primary); }
.chat-send { background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 0 16px; font-weight: 800; font-size: 13px; cursor: pointer; }

#toast {
  position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 10px 20px; border-radius: 100px;
  font-weight: 700; font-size: 12.5px; white-space: nowrap;
  z-index: 9999; transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
#toast.show { top: max(14px, env(safe-area-inset-top)); }

.overlay {
  position: fixed; inset: 0;
  background: rgba(20, 15, 18, 0.6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: 0.2s ease;
  z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 24px; padding: 24px 20px;
  width: 100%; max-width: 320px; text-align: center;
  transform: scale(0.95);
  transition: 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
}
.overlay.show .modal-box { transform: scale(1); }
#modal-icon { font-size: 32px; margin-bottom: 8px; }
#modal-title { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
#modal-msg { font-size: 12.5px; font-weight: 600; color: var(--mute); margin-bottom: 20px; line-height: 1.4; }
.modal-btn {
  width: 100%; height: 44px; border-radius: 12px; border: none;
  margin-bottom: 8px; font: 800 13.5px 'Plus Jakarta Sans', sans-serif; cursor: pointer;
}
.modal-btn-primary { background: linear-gradient(135deg, var(--primary), var(--gold)); color: #fff; }
.modal-btn-danger { background: var(--danger); color: #fff; }
.modal-btn-cancel { background: var(--paper-subtle); color: var(--mute); border: 1.5px solid var(--line); margin-bottom: 0; }
.modal-btn:active { transform: scale(0.97); }

@media (max-width: 350px) {
  .card-count { font-size: 1.4rem; }
  .top-deck { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<header id="app-header" class="hidden">
  <div class="brand">
    <div class="brand-icon">SBI</div>
    <div class="brand-text">
      <span class="brand-name">Daily Report</span>
      <span class="brand-sub">Koraput &bull; 00121</span>
    </div>
  </div>
  <div class="header-actions">
    <span id="live-date"></span>
    <button class="btn-icon" id="theme-btn" onclick="toggleTheme()" title="Switch Theme">🌙</button>
    <button class="btn-exit" onclick="openConfirm('logout')">Exit</button>
  </div>
</header>

<div id="main-content">
  <div id="login-wrapper">
    <div id="login-page">
      <div class="auth-icon">🌸</div>
      <h1>Welcome back</h1>
      <p>SBI Koraput &bull; Daily Report</p>
      <button class="btn-main" onclick="login()">Sign in to Ledger</button>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="scroll-area">
      <div class="top-deck">
        <div class="overview-card">
          <div class="ov-left">
            <span class="ov-label">Daily Total</span>
            <span class="ov-val" id="total-vol">0 / 197</span>
          </div>
          <span class="ov-sub" id="goals-cleared">0/11 Met</span>
        </div>

        <div class="action-row-top">
          <button class="chat-banner-btn" id="chat-open-btn" onclick="toggleChat()">💬 Chat</button>
          <a href="https://yonoretail.sbi.bank.in/accounts/re-kyc/kyc-entry?srcChn=RINB" target="_blank" class="quick-link-banner" title="Re-KYC Portal">
            <span>Re-KYC</span>
            <span class="quick-link-icon">
              <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </span>
          </a>
        </div>
      </div>

      <div class="section-header">Today's Numbers (Tap to +1)</div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="bottom-actions">
      <button class="action-btn reset" onclick="openConfirm('reset')">Reset</button>
      <button class="action-btn send" onclick="exportToWhatsApp()">📲 Send WhatsApp Report</button>
    </div>
  </div>
</div>

<!-- CHAT OVERLAY -->
<div id="chat-overlay" class="chat-overlay" onclick="toggleChat()">
  <div class="chat-sheet" onclick="event.stopPropagation()">
    <div class="chat-header">
      <span class="chat-title">💬 Branch Chat <span id="conn-dot" class="conn-dot" title="Connection"></span></span>
      <button class="chat-close" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-footer">
      <div class="emoji-row">
        <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
        <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendEmoji('☕')">☕</button>
        <button class="emoji-btn" onclick="sendEmoji('✅')">✅</button>
        <button class="emoji-btn" onclick="sendEmoji('🚀')">🚀</button>
        <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
        <button class="emoji-btn" onclick="sendEmoji('👋')">👋</button>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
        <button class="chat-send" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="confirm-overlay" class="overlay" onclick="closeConfirm()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-icon">⚠️</div>
    <div id="modal-title">Confirm Action</div>
    <div id="modal-msg">Are you sure?</div>
    <button class="modal-btn" id="confirm-action-btn" onclick="executeConfirm()">Proceed</button>
    <button class="modal-btn modal-btn-cancel" onclick="closeConfirm()">Cancel</button>
  </div>
</div>

<script>
const CARDS=[
  ['nps','😊','NPS Feedback',20],
  ['whatsapp','💬','WhatsApp Reg',25],
  ['yonoRegistration','📝','Yono Reg',20],
  ['contactCentre','☎️','Contact Ctr',40],
  ['cbdc','💳','CBDC',5],
  ['channelMigration','🔄','Migration',12],
  ['rekyc','🪪','Re-KYC',20],
  ['yonoUsage','📱','Yono Usage',15],
  ['whatsappUsage','📲','WA Usage',20],
  ['atmCardIssuance','🏧','ATM Card Issue',10],
  ['chequeBookIssuance','📘','Cheque Book',10]
];
const TARGETS=Object.fromEntries(CARDS.map(c=>[c[0],c[3]]));
const TOTAL_GOAL=CARDS.reduce((sum,c)=>sum+c[3],0);
const FIELDS=Object.keys(TARGETS);

document.getElementById('grid').innerHTML=CARDS.map(([f,i,t,n])=>`
  <div class="stat-card" id="btn-${f}" onclick="increment('${f}')">
    <div class="card-top-row">
      <div class="card-title-group">
        <span class="card-icon">${i}</span>
        <span class="card-title">${t}</span>
      </div>
      <span class="card-target">G:${n}</span>
    </div>
    <div class="card-body">
      <span class="card-count" id="${f}">0</span>
      <span class="tap-pill" id="pill-${f}">+1</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="pb-${f}"></div></div>
  </div>
`).join('');

function fmt(date){return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`}
function setDate(){const el=document.getElementById('live-date');if(el)el.textContent=fmt(new Date())}
function showToast(msg,dur=3500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}
function greeting(){const h=new Date().getHours();return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Pummy ✨'}

function login(){
  localStorage.setItem('sbi_a1_loggedIn','true');
  document.getElementById('login-wrapper').classList.add('hidden');
  showDashboard();showToast(greeting());
}
function showDashboard(){
  const lw=document.getElementById('login-wrapper');if(lw)lw.classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  setDate();
  loadSavedData();
  refreshTotals();
}
function doLogout(){localStorage.removeItem('sbi_a1_loggedIn');window.location.reload()}

function updateUI(field){
  const val=parseInt(document.getElementById(field).textContent)||0,target=TARGETS[field],mid=Math.floor(target/2);
  document.getElementById('pb-'+field).style.width=Math.min(Math.round(val/target*100),100)+'%';
  const btn=document.getElementById('btn-'+field);
  const pill=document.getElementById('pill-'+field);
  btn.classList.remove('mid','met');
  if(val>=target){
    btn.classList.add('met');
    if(pill)pill.textContent='✓ Done';
  }else if(val>=mid){
    btn.classList.add('mid');
    if(pill)pill.textContent='+1';
  }else{
    if(pill)pill.textContent='+1';
  }
  refreshTotals();
}

function refreshTotals(){
  let total=0,met=0;
  FIELDS.forEach(f=>{
    const v=parseInt(document.getElementById(f).textContent)||0;
    total+=v;
    if(v>=TARGETS[f])met++;
  });
  const tv=document.getElementById('total-vol');
  const gc=document.getElementById('goals-cleared');
  if(tv)tv.textContent=`${total} / ${TOTAL_GOAL}`;
  if(gc)gc.textContent=`${met}/11 Met`;
}

function increment(field){
  const el=document.getElementById(field);
  el.textContent=(parseInt(el.textContent)||0)+1;
  updateUI(field);
  saveData();
  if(navigator.vibrate)navigator.vibrate(35);
}

function saveData(){
  const d={};
  FIELDS.forEach(f=>{d[f]=document.getElementById(f).textContent});
  localStorage.setItem('sbi_a1_data',JSON.stringify(d));
}

function loadSavedData(){
  const s=localStorage.getItem('sbi_a1_data');
  if(!s)return;
  const d=JSON.parse(s);
  FIELDS.forEach(f=>{
    const el=document.getElementById(f);
    if(el){el.textContent=d[f]||0;updateUI(f);}
  });
}

/* =====================================================================
   REAL-TIME CHAT (Gun.js) — OPTIMISED
   ===================================================================== */

// >>> PUT YOUR OWN RELAY URL(S) HERE. Add a second one as backup. <<<
const RELAY_PEERS = [
  'https://YOUR-RELAY.onrender.com/gun'
];

const gun = Gun({ peers: RELAY_PEERS, localStorage: false, radisk: false });
const chatNode = gun.get('sbi_koraput_branch_00121_chat_v2');   // new key = clean start

// Persistent per-device identity (kept even after logout/reset)
let ME;
try {
  ME = localStorage.getItem('sbi_chat_me');
  if (!ME) { ME = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem('sbi_chat_me', ME); }
} catch (e) { ME = 'u' + Math.random().toString(36).slice(2, 10); }

const BOOT = Date.now();
const HISTORY_MS = 24 * 3600 * 1000;   // show last 24h only
const seen = new Set();
let unread = 0;
let chatStarted = false;
const TITLE = document.title;

function escapeHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function notifyIncoming(){
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
  const overlay=document.getElementById('chat-overlay');
  if(!overlay.classList.contains('show')){
    unread++;
    const b=document.getElementById('chat-open-btn');
    if(b) b.textContent='💬 Chat ('+unread+')';
  }
  if(document.hidden) document.title='('+(unread||1)+') New message';
}

function addMessage(m,isLocal){
  if(!m||!m.id||typeof m.text!=='string'||!m.ts) return;
  if(seen.has(m.id)) return;
  if(Date.now()-m.ts>HISTORY_MS) return;
  seen.add(m.id);

  const container=document.getElementById('chat-messages');
  const nearBottom=container.scrollHeight-container.scrollTop-container.clientHeight<80;
  const mine=m.from===ME;

  const div=document.createElement('div');
  div.className='chat-msg'+(mine?' mine':'');
  div.dataset.ts=m.ts;
  div.innerHTML=`<div>${escapeHtml(m.text)}</div><div class="time">${fmtTime(m.ts)}</div>`;

  // keep messages in timestamp order
  let ref=null;
  for(let i=container.children.length-1;i>=0;i--){
    if(Number(container.children[i].dataset.ts)<=m.ts) break;
    ref=container.children[i];
  }
  container.insertBefore(div,ref);
  if(mine||nearBottom) container.scrollTop=container.scrollHeight;

  // vibrate only for LIVE messages from the OTHER device
  const live=Date.now()-BOOT>2500 && Math.abs(Date.now()-m.ts)<120000;
  if(!mine && !isLocal && live) notifyIncoming();
}

function pushMessage(text){
  const ts=Date.now();
  const id=ts+'_'+ME+'_'+Math.random().toString(36).slice(2,5);
  const msg={id,from:ME,text,ts};
  addMessage(msg,true);          // instant on-screen (optimistic)
  chatNode.get(id).put(msg);     // background sync
}

function sendChatMessage(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text) return;
  pushMessage(text);
  input.value='';
}
function sendEmoji(emoji){ pushMessage(emoji); }

function initChatSync(){
  if(chatStarted) return;
  chatStarted=true;
  chatNode.map().on((m)=>addMessage(m,false));

  // connection indicator (green = relay connected)
  const dot=document.getElementById('conn-dot');
  gun.on('hi',()=>dot.classList.add('on'));
  gun.on('bye',()=>{
    const peers=gun._.opt&&gun._.opt.peers?Object.values(gun._.opt.peers):[];
    dot.classList.toggle('on',peers.some(p=>p&&p.wire&&p.wire.readyState===1));
  });
}

function toggleChat(){
  const overlay=document.getElementById('chat-overlay');
  overlay.classList.toggle('show');
  if(overlay.classList.contains('show')){
    unread=0;
    document.title=TITLE;
    const b=document.getElementById('chat-open-btn');
    if(b) b.textContent='💬 Chat';
    const c=document.getElementById('chat-messages');
    c.scrollTop=c.scrollHeight;
  }
}

document.getElementById('chat-input').addEventListener('keypress',(e)=>{
  if(e.key==='Enter') sendChatMessage();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && !document.getElementById('chat-overlay').classList.contains('show')) document.title=TITLE;
});

/* ===================================================================== */

function exportToWhatsApp(){
  const today=fmt(new Date()),d={};FIELDS.forEach(f=>{d[f]=document.getElementById(f).textContent});
  const msg=`*Date:* ${today}\n*Name:* ELIPOMA NAG\n*Branch name:* SBI KORAPUT\n*Branch code:* 00121\n\n*Data Report:*\nNPS: ${d.nps}\nWhatsApp: ${d.whatsapp}\nYono Registration: ${d.yonoRegistration}\nContact Centre: ${d.contactCentre}\nCBDC: ${d.cbdc}\nChannel Migration: ${d.channelMigration}\nRe-KYC: ${d.rekyc}\nWhatsApp Usage: ${d.whatsappUsage}\nYono Usage: ${d.yonoUsage}\nATM Card Issuance: ${d.atmCardIssuance}\nCheque Book Issuance: ${d.chequeBookIssuance}`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function doReset(){
  FIELDS.forEach(f=>{document.getElementById(f).textContent='0';updateUI(f)});
  localStorage.removeItem('sbi_a1_data');
  showToast('All counts reset.');
}

let pendingConfirmAction=null;
function openConfirm(type){
  pendingConfirmAction=type;
  const icon=document.getElementById('modal-icon'),title=document.getElementById('modal-title'),msg=document.getElementById('modal-msg'),btn=document.getElementById('confirm-action-btn');
  if(type==='reset'){icon.textContent='🗑️';title.textContent='Reset counts?';msg.textContent='This will erase all of today\'s counts. It cannot be undone.';btn.className='modal-btn modal-btn-danger';btn.textContent='Yes, reset'}
  else{icon.textContent='🔒';title.textContent='Sign out?';msg.textContent='Are you sure you want to sign out?';btn.className='modal-btn modal-btn-primary';btn.textContent='Sign out'}
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('show');pendingConfirmAction=null}
function executeConfirm(){if(pendingConfirmAction==='reset')doReset();else if(pendingConfirmAction==='logout')doLogout();closeConfirm()}

function toggleTheme(){
  document.body.classList.toggle('dark-theme');
  const isDark=document.body.classList.contains('dark-theme');
  localStorage.setItem('sbi_a1_theme',isDark?'dark':'light');
  document.getElementById('theme-btn').textContent=isDark?'☀️':'🌙';
}
function applySavedTheme(){
  if(localStorage.getItem('sbi_a1_theme')==='dark'){
    document.body.classList.add('dark-theme');
    document.getElementById('theme-btn').textContent='☀️';
  }
}

window.onload=()=>{
  applySavedTheme();
  initChatSync();   // start listening immediately, not only after login
  if(localStorage.getItem('sbi_a1_loggedIn')==='true'){
    document.getElementById('login-wrapper').classList.add('hidden');showDashboard();
  }
};
</script>
</body>
</html>
