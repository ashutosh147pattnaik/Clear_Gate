<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SBI Daily Report</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0730;--bg2:#4a1a63;--cream:#fff6e4;--ink:#3a1d4d;--mute:#7b6390;--line:#f0e2c4;--gold:#ffc65c;--rose:#ff6fa5;--teal:#2fb9a6;--amber:#f5a623;--green:#2fb97a;--danger:#e5484d}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse 90% 45% at 50% 105%,#ff6fa566,transparent 70%),radial-gradient(ellipse 60% 35% at 15% 5%,#8a4ad055,transparent 65%),linear-gradient(var(--bg1),var(--bg2))}
.hidden{display:none!important}
header{background:#12052299;backdrop-filter:blur(10px);border-bottom:2px solid #ffc65c55;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;z-index:100;color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--rose));color:#2a0f3d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-weight:800;font-size:15px}
.brand-sub{font-size:10px;color:#d9c3ee;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:12px}
#live-date{font-size:12px;font-weight:700;color:var(--gold)}
.btn-exit{background:transparent;border:1.5px solid #ff8e93;color:#ff8e93;padding:5px 12px;border-radius:20px;font:700 11px 'Nunito',sans-serif;cursor:pointer}
.btn-exit:active{transform:scale(.95)}
#main-content{display:flex;flex-direction:column;flex:1;min-height:0;max-width:500px;width:100%;margin:0 auto;position:relative}
#login-wrapper{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#login-page{background:var(--cream);border:3px solid var(--gold);border-radius:26px;padding:38px 24px;text-align:center;width:100%;box-shadow:0 0 0 6px #ffc65c33,0 25px 50px #0008}
.auth-icon{width:70px;height:70px;margin:-72px auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--rose));border:4px solid var(--cream);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 20px #0006}
#login-page h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:2.6rem;color:var(--bg2);margin-bottom:4px}
#login-page p{font-weight:600;font-size:.95rem;color:var(--mute);margin-bottom:26px}
.btn-main{width:100%;height:50px;border-radius:30px;background:linear-gradient(90deg,var(--gold),var(--rose));color:#2a0f3d;border:none;font:800 15px 'Nunito',sans-serif;cursor:pointer;box-shadow:0 4px 0 #d9477f}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #d9477f}
#dashboard{display:flex;flex-direction:column;flex:1;min-height:0}
.scroll-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
.quick-link-banner{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;color:var(--ink);text-decoration:none;font-weight:800;font-size:13px;box-shadow:0 4px 0 #d9a93f}
.quick-link-banner:active{transform:translateY(3px);box-shadow:none}
.quick-link-icon-wrapper{display:flex;align-items:center;gap:10px}
.quick-link-icon svg{width:18px;height:18px;stroke:var(--teal);fill:none;stroke-width:2.2;display:block}
.quick-link-arrow{color:var(--mute)}
.section-header{font-weight:800;font-size:12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.section-header::after{content:"";flex:1;height:1px;background:#ffc65c55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.grid>div:last-child:nth-child(odd){grid-column:1/-1}
.stat-card{background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #d9c79b;transition:transform .12s,box-shadow .12s}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--teal)}
.stat-card:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c79b}
.card-head{display:flex;justify-content:space-between;align-items:flex-start}
.card-icon{font-size:18px}
.card-target{font-weight:800;font-size:10px;color:var(--mute);background:#fff;border:1px solid var(--line);padding:2px 7px;border-radius:10px}
.card-title{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.card-count{font-size:2.1rem;font-weight:800;color:var(--ink);line-height:1}
.progress-track{width:100%;height:6px;background:#eadcbd;border-radius:6px;overflow:hidden;margin-top:2px}
.progress-fill{height:100%;background:var(--teal);width:0%;transition:.4s ease;border-radius:6px}
.stat-card.mid::before,.stat-card.mid .progress-fill{background:var(--amber)}
.stat-card.mid .card-count{color:#c77d0a}
.stat-card.met::before,.stat-card.met .progress-fill{background:var(--green)}
.stat-card.met .card-count{color:var(--green)}
.stat-card.met{background:#eafaf0;border-color:#a6e3bf}
.bottom-actions{background:#12052299;backdrop-filter:blur(10px);border-top:2px solid #ffc65c55;padding:12px 16px max(12px,env(safe-area-inset-bottom));display:flex;gap:12px;z-index:10}
.action-btn{flex:1;height:46px;border-radius:30px;border:none;font:800 13px 'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.action-btn:active{transform:scale(.96)}
.action-btn.send{background:linear-gradient(90deg,var(--gold),var(--rose));color:#2a0f3d}
.action-btn.reset{background:transparent;border:1.5px solid #ff8e93;color:#ff8e93;flex:.6}
#toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a0f3d;padding:10px 20px;border-radius:30px;font-weight:800;font-size:13px;white-space:nowrap;z-index:9999;transition:top .4s cubic-bezier(.4,0,.2,1);box-shadow:0 6px 18px #0006}
#toast.show{top:max(16px,env(safe-area-inset-top))}
.overlay{position:fixed;inset:0;background:rgba(10,3,20,.78);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s ease;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--cream);border:3px solid var(--gold);border-radius:22px;padding:24px;width:100%;max-width:320px;text-align:center;transform:scale(.95);transition:.3s cubic-bezier(.175,.885,.32,1.275)}
.overlay.show .modal-box{transform:scale(1)}
#modal-icon{font-size:34px;margin-bottom:10px}
#modal-title{font-size:1.15rem;font-weight:800;margin-bottom:8px}
#modal-msg{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:22px}
.modal-btn{width:100%;height:46px;border-radius:30px;border:none;margin-bottom:10px;font:800 14px 'Nunito',sans-serif;cursor:pointer}
.modal-btn-primary{background:linear-gradient(90deg,var(--gold),var(--rose));color:#2a0f3d}
.modal-btn-danger{background:var(--danger);color:#fff}
.modal-btn-cancel{background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.modal-btn:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header id="app-header" class="hidden">
  <div class="brand"><div class="brand-icon">SB</div><div class="brand-text"><span class="brand-name">Daily Report</span><span class="brand-sub">Koraput Branch</span></div></div>
  <div class="header-actions"><span id="live-date"></span><button class="btn-exit" onclick="openConfirm('logout')">Exit</button></div>
</header>

<div id="main-content">
  <div id="login-wrapper">
    <div id="login-page">
      <div class="auth-icon">🎀</div>
      <h1>Welcome back</h1>
      <p>Daily Report Portal</p>
      <button class="btn-main" onclick="login()">Sign in</button>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="scroll-area">
      <a href="https://yonoretail.sbi.bank.in/accounts/re-kyc/kyc-entry?srcChn=RINB" target="_blank" class="quick-link-banner">
        <div class="quick-link-icon-wrapper"><span class="quick-link-icon"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span><span>SBI Re-KYC Portal</span></div>
        <span class="quick-link-arrow">→</span>
      </a>
      <div class="section-header">Today's Numbers</div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="bottom-actions">
      <button class="action-btn reset" onclick="openConfirm('reset')">Reset</button>
      <button class="action-btn send" onclick="exportToWhatsApp()">📱 Send Report</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="confirm-overlay" class="overlay" onclick="closeConfirm()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-icon">⚠️</div><div id="modal-title">Confirm Action</div><div id="modal-msg">Are you sure?</div>
    <button class="modal-btn" id="confirm-action-btn" onclick="executeConfirm()">Proceed</button>
    <button class="modal-btn modal-btn-cancel" onclick="closeConfirm()">Cancel</button>
  </div>
</div>

<script>
const CARDS=[['nps','😊','NPS Feedback',20],['whatsapp','💬','WhatsApp Reg',25],['yonoRegistration','📝','Yono Reg',20],['contactCentre','☎️','Contact Ctr',40],['cbdc','💳','CBDC',5],['channelMigration','🔄','Migration',12],['rekyc','🪪','Re-KYC',20],['yonoUsage','📱','Yono Usage',15],['whatsappUsage','📲','WA Usage',20],['atmCardIssuance','🏧','ATM Card Issue',10],['chequeBookIssuance','📘','Cheque Book',10]];
const TARGETS=Object.fromEntries(CARDS.map(c=>[c[0],c[3]]));
const FIELDS=Object.keys(TARGETS);
document.getElementById('grid').innerHTML=CARDS.map(([f,i,t,n])=>`<div class="stat-card" id="btn-${f}" onclick="increment('${f}')"><div class="card-head"><span class="card-icon">${i}</span><span class="card-target">Target ${n}</span></div><div class="card-title">${t}</div><div class="card-body"><span class="card-count" id="${f}">0</span></div><div class="progress-track"><div class="progress-fill" id="pb-${f}"></div></div></div>`).join('');

function fmt(date){return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`}
function setDate(){const el=document.getElementById('live-date');if(el)el.textContent=fmt(new Date())}
function showToast(msg,dur=3500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}
function greeting(){const h=new Date().getHours();return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+', Pummy.'}

function login(){
  localStorage.setItem('sbi_a1_loggedIn','true');
  document.getElementById('login-wrapper').classList.add('hidden');
  showDashboard();showToast(greeting());
}
function showDashboard(){
  const lw=document.getElementById('login-wrapper');if(lw)lw.classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  setDate();loadSavedData();
}
function doLogout(){localStorage.removeItem('sbi_a1_loggedIn');window.location.reload()}
function updateUI(field){
  const val=parseInt(document.getElementById(field).textContent)||0,target=TARGETS[field],mid=Math.floor(target/2);
  document.getElementById('pb-'+field).style.width=Math.min(Math.round(val/target*100),100)+'%';
  const btn=document.getElementById('btn-'+field);btn.classList.remove('mid','met');
  if(val>=target)btn.classList.add('met');else if(val>=mid)btn.classList.add('mid');
}
function increment(field){const el=document.getElementById(field);el.textContent=(parseInt(el.textContent)||0)+1;updateUI(field);saveData();if(navigator.vibrate)navigator.vibrate(40)}
function saveData(){const d={};FIELDS.forEach(f=>{d[f]=document.getElementById(f).textContent});localStorage.setItem('sbi_a1_data',JSON.stringify(d))}
function loadSavedData(){const s=localStorage.getItem('sbi_a1_data');if(!s)return;const d=JSON.parse(s);FIELDS.forEach(f=>{const el=document.getElementById(f);if(el){el.textContent=d[f]||0;updateUI(f)}})}
function exportToWhatsApp(){
  const today=fmt(new Date()),d={};FIELDS.forEach(f=>{d[f]=document.getElementById(f).textContent});
  const msg=`*Date:* ${today}\n*Name:* ELIPOMA NAG\n*Branch name:* SBI KORAPUT\n*Branch code:* 00121\n\n*Data Report:*\nNPS: ${d.nps}\nWhatsApp: ${d.whatsapp}\nYono Registration: ${d.yonoRegistration}\nContact Centre: ${d.contactCentre}\nCBDC: ${d.cbdc}\nChannel Migration: ${d.channelMigration}\nRe-KYC: ${d.rekyc}\nWhatsApp Usage: ${d.whatsappUsage}\nYono Usage: ${d.yonoUsage}\nATM Card Issuance: ${d.atmCardIssuance}\nCheque Book Issuance: ${d.chequeBookIssuance}`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
function doReset(){FIELDS.forEach(f=>{document.getElementById(f).textContent='0';updateUI(f)});localStorage.removeItem('sbi_a1_data');showToast('All counts reset.')}

let pendingConfirmAction=null;
function openConfirm(type){
  pendingConfirmAction=type;
  const icon=document.getElementById('modal-icon'),title=document.getElementById('modal-title'),msg=document.getElementById('modal-msg'),btn=document.getElementById('confirm-action-btn');
  if(type==='reset'){icon.textContent='🗑️';title.textContent='Reset counts?';msg.textContent='This will erase all of today\'s counts. It cannot be undone.';btn.className='modal-btn modal-btn-danger';btn.textContent='Yes, reset'}
  else{icon.textContent='🔒';title.textContent='Sign out?';msg.textContent='Are you sure you want to sign out?';btn.className='modal-btn modal-btn-primary';btn.textContent='Sign out'}
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('show');pendingConfirmAction=null}
function executeConfirm(){if(pendingConfirmAction==='reset')doReset();else if(pendingConfirmAction==='logout')doLogout();closeConfirm()}

window.onload=()=>{
  if(localStorage.getItem('sbi_a1_loggedIn')==='true'){
    document.getElementById('login-wrapper').classList.add('hidden');showDashboard();
  }
};
</script>
</body>
</html>
