<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Daily Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --sbi-blue: #003f87;
            --sbi-light-blue: #0052a3;
            --sbi-gold: #d4af37;
            --sbi-gray: #f4f6f9;
            --text-dark: #333333;
            --text-light: #666666;
            --success: #25D366;
            --success-dark: #1da851;
            --warning: #e74c3c;
            --border: #e2e8f0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #001f40; /* Solid mobile-friendly background */
            color: var(--text-dark);
        }

        /* ===== LOGIN PAGE ===== */
        .login-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 25px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .sbi-logo {
            width: 70px;
            height: 70px;
            background: var(--sbi-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .sbi-logo::before {
            content: "SBI";
            color: var(--sbi-gold);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .login-header h1 { color: var(--sbi-blue); font-size: 1.4rem; margin-bottom: 4px; font-weight: 700; }
        .login-header p { color: var(--text-light); font-size: 0.85rem; margin-bottom: 25px; font-weight: 600; }

        .login-btn {
            width: 100%; padding: 14px;
            background: var(--sbi-light-blue);
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        
        .login-btn:active { background: var(--sbi-blue); }

        /* ===== DASHBOARD ===== */
        .dashboard {
            display: none;
            background: var(--sbi-gray);
            width: 94%; height: 96%; max-width: 600px;
            border-radius: 16px; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .dashboard.show {
            display: flex;
        }

        .dashboard-header {
            background: var(--sbi-blue);
            color: white; padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .header-left h2 { font-size: 1.1rem; margin-bottom: 2px; }
        .header-left p { font-size: 0.75rem; opacity: 0.9; margin: 0; font-weight: 500; }

        .logout-btn {
            background: transparent; color: white;
            border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 12px;
            border-radius: 8px; font-size: 0.75rem; font-weight: bold;
        }
        .logout-btn:active { background: rgba(255, 255, 255, 0.2); }

        .dashboard-content { padding: 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .date-display {
            text-align: right; font-size: 0.85rem; font-weight: 700;
            color: var(--sbi-blue); margin-bottom: 12px; flex-shrink: 0;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* GRID & BUTTONS */
        .buttons-grid {
            flex: 1; display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px; margin-bottom: 16px;
        }

        .counter-button {
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 10px 5px; cursor: pointer; position: relative;
        }

        /* Standard Mobile touch feedback */
        .counter-button:active {
            background: #f8fafc;
            transform: scale(0.98);
            border-color: #cbd5e1;
        }

        .button-icon { font-size: 1.5rem; margin-bottom: 4px; }

        .button-label {
            color: var(--text-dark); font-size: 0.85rem;
            font-weight: 700; margin-bottom: 2px; text-align: center;
        }

        .target-label {
            font-size: 0.65rem; color: #94a3b8; font-weight: 700;
            margin-bottom: 6px; letter-spacing: 0.5px;
        }

        .button-counter {
            background: #eaf1f8; color: var(--sbi-blue);
            font-size: 1.4rem; font-weight: 800; padding: 4px 20px;
            border-radius: 8px; margin-bottom: 8px;
        }

        /* Progress Bar Styles */
        .pb-wrap {
            width: 80%; height: 6px;
            background: #e2e8f0; border-radius: 10px;
            overflow: hidden;
        }
        
        .pb-fill {
            height: 100%; width: 0%;
            background: var(--sbi-light-blue);
            border-radius: 10px;
        }

        /* ===== TARGET MET STATE ===== */
        .counter-button.target-met {
            background: var(--success);
            border-color: var(--success-dark);
        }
        
        .counter-button.target-met:active {
            background: var(--success-dark);
        }

        .counter-button.target-met .button-label, 
        .counter-button.target-met .target-label { color: white; }
        
        .counter-button.target-met .button-counter {
            background: rgba(255, 255, 255, 0.25); color: white;
        }

        .counter-button.target-met .pb-wrap { background: rgba(0, 0, 0, 0.2); }
        .counter-button.target-met .pb-fill { background: white; }

        /* Actions */
        .action-buttons { display: flex; gap: 12px; flex-shrink: 0; padding-bottom: 5px; }

        .action-btn {
            flex: 1; padding: 14px; font-size: 0.9rem; font-weight: bold;
            border: none; border-radius: 10px; color: white; 
        }
        .action-btn:active { opacity: 0.8; transform: scale(0.98); }

        .submit-btn { background: var(--success); }
        .reset-btn { background: var(--warning); flex: 0.4; }

    </style>
</head>
<body>

    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <div class="sbi-logo"></div>
            <h1>Daily Workbook</h1>
            <p>Field Operations Report</p>
        </div>
        <button class="login-btn" onclick="login()">Access Workspace</button>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <div class="header-left">
                <h2>📊 Workbook</h2>
                <p>Tap to count activities</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="dashboard-content">
            <div class="date-display" id="todayDate"></div>

            <div class="buttons-grid">
                <div class="counter-button" id="btn-nps" onclick="increment('nps')">
                    <span class="button-icon">😊</span>
                    <span class="button-label">NPS</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="nps">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-nps"></div></div>
                </div>

                <div class="counter-button" id="btn-whatsapp" onclick="increment('whatsapp')">
                    <span class="button-icon">💬</span>
                    <span class="button-label">WhatsApp</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="whatsapp">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-whatsapp"></div></div>
                </div>

                <div class="counter-button" id="btn-yonoRegistration" onclick="increment('yonoRegistration')">
                    <span class="button-icon">📝</span>
                    <span class="button-label">Yono Reg.</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="yonoRegistration">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-yonoRegistration"></div></div>
                </div>

                <div class="counter-button" id="btn-contactCentre" onclick="increment('contactCentre')">
                    <span class="button-icon">☎️</span>
                    <span class="button-label">Contact Centre</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="contactCentre">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-contactCentre"></div></div>
                </div>

                <div class="counter-button" id="btn-cbdc" onclick="increment('cbdc')">
                    <span class="button-icon">💳</span>
                    <span class="button-label">CBDC</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="cbdc">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-cbdc"></div></div>
                </div>

                <div class="counter-button" id="btn-channelMigration" onclick="increment('channelMigration')">
                    <span class="button-icon">🔄</span>
                    <span class="button-label">Migration</span>
                    <span class="target-label">Target: 30</span>
                    <div class="button-counter" id="channelMigration">0</div>
                    <div class="pb-wrap"><div class="pb-fill" id="pb-channelMigration"></div></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn submit-btn" onclick="exportToWhatsApp()">📱 Send Report</button>
                <button class="action-btn reset-btn" onclick="resetData()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Redirect to gateway if the user refreshes the page
        if (performance.getEntriesByType("navigation")[0]?.type === "reload") {
            window.location.href = "index.html";
        }

        // Global Target
        const GLOBAL_TARGET = 30;

        window.addEventListener('load', () => {
            updateCurrentDate();
            checkLoginStatus();
        });

        function formatDateDisplay(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function updateCurrentDate() {
            document.getElementById('todayDate').textContent = "Date: " + formatDateDisplay(new Date());
        }

        function login() {
            localStorage.setItem('loggedIn', 'true');
            showDashboard();
        }

        function checkLoginStatus() {
            if (localStorage.getItem('loggedIn') === 'true') {
                showDashboard();
                loadSavedData();
            }
        }

        function showDashboard() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashboard').classList.add('show');
        }

        // Function to update progress bars and colors
        function updateUI(fieldName) {
            let val = parseInt(document.getElementById(fieldName).textContent) || 0;
            let btn = document.getElementById('btn-' + fieldName);
            let pb = document.getElementById('pb-' + fieldName);
            
            // Calculate Progress Bar Width (max 100%)
            let percent = Math.min((val / GLOBAL_TARGET) * 100, 100);
            pb.style.width = percent + '%';
            
            // Toggle Target Met Colors
            if (val >= GLOBAL_TARGET) {
                btn.classList.add('target-met');
            } else {
                btn.classList.remove('target-met');
            }
        }

        function increment(fieldName) {
            let counterElement = document.getElementById(fieldName);
            let current = parseInt(counterElement.textContent) || 0;
            current++;
            counterElement.textContent = current;
            
            // Trigger UI update for this specific button
            updateUI(fieldName);

            saveData();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function saveData() {
            const data = {
                nps: document.getElementById('nps').textContent,
                whatsapp: document.getElementById('whatsapp').textContent,
                yonoRegistration: document.getElementById('yonoRegistration').textContent,
                contactCentre: document.getElementById('contactCentre').textContent,
                cbdc: document.getElementById('cbdc').textContent,
                channelMigration: document.getElementById('channelMigration').textContent
            };
            localStorage.setItem('workbookData', JSON.stringify(data));
        }

        function loadSavedData() {
            const saved = localStorage.getItem('workbookData');
            if (saved) {
                const data = JSON.parse(saved);
                const fields = ['nps', 'whatsapp', 'yonoRegistration', 'contactCentre', 'cbdc', 'channelMigration'];
                
                fields.forEach(field => {
                    document.getElementById(field).textContent = data[field] || 0;
                    // Update the UI based on loaded data
                    updateUI(field);
                });
            }
        }

        function exportToWhatsApp() {
            const today = formatDateDisplay(new Date());

            const nps = document.getElementById('nps').textContent;
            const whatsapp = document.getElementById('whatsapp').textContent;
            const yono = document.getElementById('yonoRegistration').textContent;
            const cc = document.getElementById('contactCentre').textContent;
            const cbdc = document.getElementById('cbdc').textContent;
            const cm = document.getElementById('channelMigration').textContent;

            const reportContent = `Date: ${today}\nName: ELIPOMA NAG\nBranch name: SBI KORAPUT\nBranch code: 00121\n\n*Data Report:*\nNPS: ${nps}\nWhatsApp: ${whatsapp}\nYono Registration: ${yono}\nContact Centre: ${cc}\nCBDC: ${cbdc}\nChannel Migration: ${cm}`;

            const encodedMessage = encodeURIComponent(reportContent);
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }

        function resetData() {
            if (confirm('Reset today\'s counts to zero?')) {
                const fields = ['nps', 'whatsapp', 'yonoRegistration', 'contactCentre', 'cbdc', 'channelMigration'];
                fields.forEach(field => {
                    document.getElementById(field).textContent = '0';
                });
                localStorage.removeItem('workbookData');
                window.location.href = 'index.html'; 
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('loggedIn');
                window.location.href = 'index.html'; 
            }
        }
    </script>
</body>
</html>
