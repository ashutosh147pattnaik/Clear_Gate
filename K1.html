<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Daily Report</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep:    #0b0f1a;
            --bg-card:    #141927;
            --bg-card-2:  #1a2035;
            --border:     rgba(255,255,255,0.08);
            --border-s:   rgba(255,255,255,0.14);

            --text-primary:   #f0f2f8;
            --text-secondary: #8b95b0;
            --text-muted:     #4a5270;

            --accent:   #6366f1;
            --accent-2: #818cf8;

            --mid-fill:  linear-gradient(135deg, #f59e0b, #f97316);
            --met-fill:  linear-gradient(135deg, #10b981, #34d399);

            --radius: 14px;
        }

        body, html {
            min-height: 100vh;
            width: 100%;
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            display: grid;
            place-items: start center;
            padding: 0 0 48px;
            overflow-y: auto;
        }

        /* ── HEADER ── */
        header {
            width: 100%;
            background: #0f1422;
            border-bottom: 0.5px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .brand-text { display: flex; flex-direction: column; }
        .brand-name { font-size: 14px; font-weight: 500; color: var(--text-primary); line-height: 1.2; }
        .brand-sub  { font-size: 11px; color: var(--text-muted); line-height: 1.2; }

        .header-right { display: flex; align-items: center; gap: 10px; }

        #live-date {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
        }

        .logout-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            border: 0.5px solid var(--border-s);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.15s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.10); }

        /* ── MAIN CONTENT ── */
        #main-content {
            width: 94%;
            max-width: 540px;
            margin: 0 auto;
            padding-top: 20px;
        }

        /* ── LOGIN ── */
        #login-page {
            background: var(--bg-card);
            border: 0.5px solid var(--border-s);
            border-radius: 20px;
            padding: 44px 28px;
            text-align: center;
            margin-top: 40px;
        }

        .logo-mark {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        #login-page h1 {
            font-size: 1.35rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        #login-page p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 28px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: opacity 0.15s;
        }
        .login-btn:hover { opacity: 0.88; }
        .login-btn:active { opacity: 0.75; transform: scale(0.98); }

        .hidden { display: none !important; }

        /* ── DASHBOARD ── */
        #dashboard {}

        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        /* ── COUNTER GRID ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .counter-btn {
            background: var(--bg-card);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
            -webkit-user-select: none;
            user-select: none;
        }

        .counter-btn:active { transform: scale(0.96); }
        .counter-btn:hover  { border-color: var(--border-s); background: var(--bg-card-2); }

        .cb-icon  { font-size: 1.5rem; margin-bottom: 4px; }
        .cb-name  { font-size: 12px; font-weight: 500; color: var(--text-secondary); text-align: center; line-height: 1.3; }
        .cb-target { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

        .cb-count {
            font-size: 1.9rem;
            font-weight: 500;
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
            line-height: 1;
            margin-bottom: 8px;
        }

        .pb-wrap {
            width: 80%;
            height: 3px;
            background: rgba(255,255,255,0.07);
            border-radius: 99px;
            overflow: hidden;
        }
        .pb-fill {
            height: 100%;
            border-radius: 99px;
            background: var(--accent-2);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* MID state */
        .counter-btn.mid {
            background: #1c1608;
            border-color: rgba(245,158,11,0.25);
        }
        .counter-btn.mid .cb-count { color: #fbbf24; }
        .counter-btn.mid .pb-fill  { background: #f59e0b; }
        .counter-btn.mid .cb-name  { color: #fcd34d; }

        /* MET state */
        .counter-btn.met {
            background: #0a1f14;
            border-color: rgba(16,185,129,0.25);
        }
        .counter-btn.met .cb-count { color: #34d399; }
        .counter-btn.met .pb-fill  { background: #10b981; }
        .counter-btn.met .cb-name  { color: #6ee7b7; }

        .full-width { grid-column: 1 / -1; }

        /* ── ACTION STRIP ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 12px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .act-btn {
            padding: 13px 10px;
            border-radius: 10px;
            border: 0.5px solid var(--border-s);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background 0.15s;
        }
        .act-btn:hover  { background: var(--bg-card-2); }
        .act-btn:active { transform: scale(0.98); }

        .act-btn.send  { background: #10251b; border-color: rgba(16,185,129,0.3); color: #34d399; }
        .act-btn.reset { background: #1f1010; border-color: rgba(239,68,68,0.25); color: #f87171; }

        .act-btn .ab-icon { font-size: 16px; }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card-2);
            border: 0.5px solid var(--border-s);
            color: var(--text-primary);
            padding: 13px 22px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            z-index: 9999;
            transition: bottom 0.4s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #toast.show { bottom: 36px; }
    </style>
</head>
<body>

<!-- HEADER (shown after login) -->
<header id="app-header" class="hidden">
    <div class="brand">
        <div class="brand-icon">SBI</div>
        <div class="brand-text">
            <span class="brand-name">Daily report</span>
            <span class="brand-sub">Koraput branch</span>
        </div>
    </div>
    <div class="header-right">
        <span id="live-date"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<div id="main-content">

    <!-- LOGIN -->
    <div id="login-page">
        <div class="logo-mark">SBI</div>
        <h1>Daily workbook</h1>
        <p>Field operations report</p>
        <button class="login-btn" onclick="login()">Access workspace</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <p class="section-label">Today's targets</p>

        <div class="grid">
            <div class="counter-btn" id="btn-nps" onclick="increment('nps')">
                <span class="cb-icon">😊</span>
                <span class="cb-name">NPS</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="nps">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-nps"></div></div>
            </div>

            <div class="counter-btn" id="btn-whatsapp" onclick="increment('whatsapp')">
                <span class="cb-icon">💬</span>
                <span class="cb-name">WhatsApp</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="whatsapp">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-whatsapp"></div></div>
            </div>

            <div class="counter-btn" id="btn-yonoRegistration" onclick="increment('yonoRegistration')">
                <span class="cb-icon">📝</span>
                <span class="cb-name">Yono Reg.</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="yonoRegistration">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-yonoRegistration"></div></div>
            </div>

            <div class="counter-btn" id="btn-contactCentre" onclick="increment('contactCentre')">
                <span class="cb-icon">☎️</span>
                <span class="cb-name">Contact centre</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="contactCentre">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-contactCentre"></div></div>
            </div>

            <div class="counter-btn" id="btn-cbdc" onclick="increment('cbdc')">
                <span class="cb-icon">💳</span>
                <span class="cb-name">CBDC</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="cbdc">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-cbdc"></div></div>
            </div>

            <div class="counter-btn" id="btn-channelMigration" onclick="increment('channelMigration')">
                <span class="cb-icon">🔄</span>
                <span class="cb-name">Migration</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="channelMigration">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-channelMigration"></div></div>
            </div>

            <div class="counter-btn" id="btn-yonoReregistration" onclick="increment('yonoReregistration')">
                <span class="cb-icon">🔐</span>
                <span class="cb-name">Yono Re-Reg</span>
                <span class="cb-target">Target: 30</span>
                <div class="cb-count" id="yonoReregistration">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-yonoReregistration"></div></div>
            </div>

            <div class="counter-btn" id="btn-rekyc" onclick="increment('rekyc')">
                <span class="cb-icon">🪪</span>
                <span class="cb-name">Re-KYC</span>
                <span class="cb-target">Target: 20</span>
                <div class="cb-count" id="rekyc">0</div>
                <div class="pb-wrap"><div class="pb-fill" id="pb-rekyc"></div></div>
            </div>
        </div>

        <div class="divider">Actions</div>

        <div class="actions">
            <button class="act-btn send"  onclick="exportToWhatsApp()">
                <span class="ab-icon">📱</span> Send report
            </button>
            <button class="act-btn reset" onclick="resetData()">
                <span class="ab-icon">↺</span> Reset
            </button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const TARGETS = {
        nps: 30, whatsapp: 30, yonoRegistration: 30,
        contactCentre: 30, cbdc: 30, channelMigration: 30,
        yonoReregistration: 30, rekyc: 20
    };

    const FIELDS = Object.keys(TARGETS);

    function fmt(date) {
        const d = String(date.getDate()).padStart(2,'0');
        const m = String(date.getMonth()+1).padStart(2,'0');
        const y = date.getFullYear();
        return `${d}/${m}/${y}`;
    }

    function setDate() {
        const el = document.getElementById('live-date');
        if (el) el.textContent = fmt(new Date());
    }

    function showToast(msg, dur = 3500) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), dur);
    }

    function login() {
        localStorage.setItem('sbi_a1_loggedIn', 'true');
        showDashboard();
        const h = new Date().getHours();
        const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
        showToast(`${greet}, Pummy! Have a great day.`);
    }

    function showDashboard() {
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('app-header').classList.remove('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        setDate();
        loadSavedData();
    }

    function logout() {
        if (confirm('Log out?')) {
            localStorage.removeItem('sbi_a1_loggedIn');
            window.location.href = 'index.html';
        }
    }

    function updateUI(field) {
        const val = parseInt(document.getElementById(field).textContent) || 0;
        const target = TARGETS[field];
        const mid = Math.floor(target / 2);
        const pct = Math.min(Math.round((val / target) * 100), 100);

        document.getElementById('pb-' + field).style.width = pct + '%';

        const btn = document.getElementById('btn-' + field);
        btn.classList.remove('mid', 'met');
        if (val >= target)     btn.classList.add('met');
        else if (val >= mid)   btn.classList.add('mid');
    }

    function increment(field) {
        const el = document.getElementById(field);
        el.textContent = (parseInt(el.textContent) || 0) + 1;
        updateUI(field);
        saveData();
        if (navigator.vibrate) navigator.vibrate(40);
    }

    function saveData() {
        const data = {};
        FIELDS.forEach(f => { data[f] = document.getElementById(f).textContent; });
        localStorage.setItem('sbi_a1_data', JSON.stringify(data));
    }

    function loadSavedData() {
        const saved = localStorage.getItem('sbi_a1_data');
        if (!saved) return;
        const data = JSON.parse(saved);
        FIELDS.forEach(f => {
            const el = document.getElementById(f);
            if (el) { el.textContent = data[f] || 0; updateUI(f); }
        });
    }

    function exportToWhatsApp() {
        const today = fmt(new Date());
        const d = {};
        FIELDS.forEach(f => { d[f] = document.getElementById(f).textContent; });

        const msg =
            `Date: ${today}\n` +
            `Name: ELIPOMA NAG\n` +
            `Branch name: SBI KORAPUT\n` +
            `Branch code: 00121\n\n` +
            `*Data Report:*\n` +
            `NPS: ${d.nps}\n` +
            `WhatsApp: ${d.whatsapp}\n` +
            `Yono Registration: ${d.yonoRegistration}\n` +
            `Yono Re-Registration: ${d.yonoReregistration}\n` +
            `Contact Centre: ${d.contactCentre}\n` +
            `CBDC: ${d.cbdc}\n` +
            `Channel Migration: ${d.channelMigration}\n` +
            `Re-KYC: ${d.rekyc}`;

        window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }

    function resetData() {
        if (confirm("Reset today's counts to zero?")) {
            FIELDS.forEach(f => {
                document.getElementById(f).textContent = '0';
                updateUI(f);
            });
            localStorage.removeItem('sbi_a1_data');
        }
    }

    window.onload = () => {
        if (localStorage.getItem('sbi_a1_loggedIn') === 'true') showDashboard();
    };
</script>
</body>
</html>
