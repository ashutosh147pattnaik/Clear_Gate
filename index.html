<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pocket Dimension Theme Palette */
            --glass-bg:        rgba(255, 255, 255, 0.08);
            --glass-border:    rgba(255, 255, 255, 0.15);
            --glass-hover:     rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            
            --text-main:       #ffffff;
            --text-muted:      rgba(255, 255, 255, 0.65);
            
            --r-pill: 100px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* The Animated Ethereal Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Smooth Entrance Animation */
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(-45deg, #1e1b4b, #701a75, #9333ea, #ea580c);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            display: grid;
            place-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- Glass Card --- */
        .gateway-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--glass-highlight);
            animation: floatIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        /* --- Logo --- */
        .logo-mark {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f9a8d4, #c084fc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.6);
        }

        .logo-mark span {
            color: #1e1b4b;
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #dynamic-wish {
            font-size: 0.9rem;
            font-weight: 500;
            color: #f9a8d4;
            min-height: 20px;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            transition: opacity 0.5s ease;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--glass-border);
            margin: 0 0 1.5rem;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--r-pill);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .nav-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border-color: var(--glass-highlight);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .btn-label {
            flex: 1;
            text-align: left;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-arrow {
            color: var(--text-muted);
            font-size: 1.4rem;
            font-weight: 400;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .nav-btn:hover .btn-arrow {
            transform: translateX(4px);
            color: #f9a8d4;
        }

        /* --- Footer --- */
        .footer-text {
            margin-top: 2rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-mark"><span>SBI</span></div>
        <h1>Operations Gateway</h1>
        <p id="dynamic-wish">Loading workspace...</p>

        <hr class="divider">

        <div class="btn-group">
            <a href="K1.html" class="nav-btn btn-target">
                <div class="btn-icon">🎯</div>
                <span class="btn-label">Target Portal (Elipoma)</span>
                <span class="btn-arrow">›</span>
            </a>
            <a href="A1.html" class="nav-btn btn-report">
                <div class="btn-icon">📊</div>
                <span class="btn-label">Daily Report (Ashutosh)</span>
                <span class="btn-arrow">›</span>
            </a>
        </div>

        <p class="footer-text">Secure branch access &copy; 2026</p>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead ✨",
            "Keep up the brilliant work 🚀",
            "Stay safe and productive 🛡️",
            "Let's crush our targets today 🎯",
            "Welcome back to the dashboard 📊",
            "Wishing you massive success 🌟",
            "Your hard work is appreciated 🤝"
        ];

        window.onload = () => {
            const wishEl = document.getElementById('dynamic-wish');
            wishEl.style.opacity = 0;
            
            setTimeout(() => {
                wishEl.textContent = wishes[Math.floor(Math.random() * wishes.length)];
                wishEl.style.opacity = 1;
            }, 300);
        };
    </script>

</body>
</html>
