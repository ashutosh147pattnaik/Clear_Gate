<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 2nd Theme: Midnight Slate (Dark Ops) */
            --bg-page:    #0f172a;
            --bg-card:    #1e293b;
            --bg-btn:     #334155;
            --bg-accent:  rgba(59, 130, 246, 0.2);
            --bg-success: rgba(16, 185, 129, 0.2);

            --border:         #334155;
            --border-strong:  #475569;

            --text-primary:   #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted:     #94a3b8;

            --fill-accent:  #3b82f6;
            --on-accent:    #ffffff;

            --radius: 10px;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            background: var(--bg-page);
            display: grid;
            place-items: center;
            color: var(--text-primary);
        }

        /* --- Card --- */
        .gateway-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* --- Logo --- */
        .logo-mark {
            width: 56px;
            height: 56px;
            background: var(--fill-accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .logo-mark span {
            color: var(--on-accent);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        #dynamic-wish {
            font-size: 0.8125rem;
            color: var(--text-muted);
            min-height: 20px;
            margin-bottom: 1.75rem;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0 0 1.25rem;
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--bg-btn);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .nav-btn:hover {
            background: #475569;
            border-color: #64748b;
        }

        .nav-btn:active {
            transform: scale(0.985);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .btn-target .btn-icon { background: var(--bg-accent); }
        .btn-report .btn-icon { background: var(--bg-success); }

        .btn-label {
            flex: 1;
            text-align: left;
        }

        .btn-arrow {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* --- Footer --- */
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-mark"><span>SBI</span></div>
        <h1>Operations gateway</h1>
        <p id="dynamic-wish">Loading workspace...</p>

        <hr class="divider">

        <div class="btn-group">
            <a href="K1.html" class="nav-btn btn-target">
                <div class="btn-icon">🎯</div>
                <span class="btn-label">Target portal (Elipoma)</span>
                <span class="btn-arrow">›</span>
            </a>
            <a href="A1.html" class="nav-btn btn-report">
                <div class="btn-icon">📊</div>
                <span class="btn-label">Daily report (Ashutosh)</span>
                <span class="btn-arrow">›</span>
            </a>
        </div>

        <p class="footer-text">Secure branch access &copy; 2026</p>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead",
            "Keep up the brilliant work",
            "Stay safe and productive",
            "Let's crush our targets today",
            "Welcome back to the dashboard",
            "Wishing you massive success",
            "Your hard work is appreciated"
        ];

        window.onload = () => {
            document.getElementById('dynamic-wish').textContent =
                wishes[Math.floor(Math.random() * wishes.length)];
        };
    </script>

</body>
</html>
