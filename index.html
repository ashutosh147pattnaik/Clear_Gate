<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Static professional gradient */
            background: linear-gradient(135deg, #001f40, #0a4fa6);
            background-color: #001f40;
        }

        /* --- Clean Mobile-Friendly Card --- */
        .gateway-container {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            width: 92%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .logo-placeholder {
            width: 70px;
            height: 70px;
            background: #003f87;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #d4af37;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-placeholder::before { content: "SBI"; }

        h1 {
            color: #002855;
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        #dynamic-wish {
            color: #0a4fa6;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* --- Static Mobile-Friendly Buttons --- */
        .nav-btn {
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-target {
            background: #0052a3;
        }

        .btn-report {
            background: #0fa36e;
        }

        /* Simple touch/active states for mobile feedback */
        .btn-target:active {
            background: #003f87;
        }

        .btn-report:active {
            background: #0b8257;
        }

        .icon { font-size: 1.3rem; }
        
        .footer-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #6c7a8c;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-placeholder"></div>
        <h1>Operations Gateway</h1>
        
        <div id="dynamic-wish">Loading workspace...</div>

        <div class="btn-group">
            <a href="K1.html" class="nav-btn btn-target">
                <span class="icon">🎯</span> Target Portal (Elipoma)
            </a>

            <a href="A1.html" class="nav-btn btn-report">
                <span class="icon">📊</span> Daily Report (Ashutosh)
            </a>
        </div>
        
        <div class="footer-text">Secure Branch Access &copy; 2024</div>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead! 🌟",
            "Keep up the brilliant work! 💼",
            "Stay safe and productive! 🛡️",
            "Let's crush our targets today! 🎯",
            "Welcome back to the dashboard! 👋",
            "Wishing you massive success! 🚀",
            "Your hard work is appreciated! 💡"
        ];

        // Pick a single random wish on page load, no looping or fading.
        window.onload = () => {
            const initialWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('dynamic-wish').textContent = initialWish;
        };
    </script>

</body>
</html>
