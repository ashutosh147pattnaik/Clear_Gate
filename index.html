<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Informa v3.2</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">

    <style>
        :root {
            --primary-color: #2D5BFF;
            --bg-gradient: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #FFFFFF;
            --text-dim: #94A3B8;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0F172A; 
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            color: var(--text-main);
            overscroll-behavior: none;
            min-height: 100vh;
            transition: all 0.5s ease;
        }

        .app-shell { width: 100%; max-width: 450px; display: flex; flex-direction: column; }

        header {
            padding: 30px 20px;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 100;
        }

        header h1 {
            margin: 0; font-size: 28px; font-weight: 800;
            color: var(--primary-color);
            text-shadow: 0 0 15px rgba(var(--primary-rgb), 0.4);
        }

        header p { margin: 4px 0 0; font-size: 14px; color: var(--text-dim); font-weight: 500; }

        .content { padding: 16px; flex-grow: 1; }

        .section-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: var(--primary-color); margin: 24px 0 12px 8px; letter-spacing: 2px; opacity: 0.8;
        }

        .card {
            background: var(--card-bg); border-radius: 24px; padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); margin-bottom: 20px;
        }

        .btn {
            width: 100%; border: none; border-radius: 18px; padding: 18px;
            font-size: 16px; font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.08); color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }

        .btn-attendance {
            background: var(--primary-color); color: #000; justify-content: center;
            font-weight: 800; box-shadow: 0 4px 20px rgba(var(--primary-rgb), 0.4); border: none;
        }

        .counter-badge {
            background: rgba(255, 255, 255, 0.1); color: var(--primary-color);
            padding: 4px 14px; border-radius: 12px; font-size: 14px;
            font-weight: 800; border: 1px solid var(--primary-color);
        }

        .bottom-nav {
            padding: 24px; position: sticky; bottom: 0;
            background: linear-gradient(0deg, rgba(15,23,42,1) 40%, transparent 100%);
        }

        .btn-main-action {
            background: var(--primary-color); color: #000; justify-content: center;
            font-weight: 800; font-size: 18px; height: 64px; box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.4);
        }

        /* Modal UI */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }

        .modal {
            background: #1E293B; width: 100%; max-width: 340px; border-radius: 32px;
            padding: 30px; text-align: center; border: 1px solid var(--primary-color);
        }

        .modal h2 { margin-top: 0; color: var(--primary-color); margin-bottom: 20px; }
        
        /* New Segmented Toggle for Phone/Account */
        .input-toggle-container {
            display: flex; background: rgba(255,255,255,0.05);
            border-radius: 12px; padding: 4px; margin-bottom: 16px;
        }
        .toggle-option {
            flex: 1; padding: 12px; font-size: 14px; font-weight: 700;
            color: var(--text-dim); border-radius: 10px; cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-option.active {
            background: var(--primary-color); color: #000;
            box-shadow: 0 2px 10px rgba(var(--primary-rgb), 0.3);
        }

        .modal input {
            width: 100%; padding: 16px; font-size: 24px; background: #0F172A;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            text-align: center; margin-bottom: 20px; color: var(--primary-color);
            font-weight: 800; outline: none; box-sizing: border-box;
        }

        .btn-cancel { background: #334155; color: white; justify-content: center; }
        .btn-confirm { background: var(--primary-color); color: #000; justify-content: center; }
        .btn-whatsapp { background: #25D366; color: white; justify-content: center; margin-top: 24px; font-weight: 800; }
        
        #reportView { display: none; }
    </style>
</head>
<body>

    <div class="app-shell" id="mainView">
        <header>
            <h1 id="dynamicTitle">Informa</h1>
            <p id="currentDate"></p>
        </header>

        <div class="content">
            <div class="section-label">Duty Status</div>
            <div class="card">
                <button class="btn btn-attendance" onclick="markPresent()">LOG ATTENDANCE</button>
            </div>

            <div class="section-label">Operations Log</div>
            <div class="card">
                <button class="btn" onclick="handleActivity('nps', 'NPS', true)">
                    NPS Forms <span class="counter-badge" id="badge-nps">0</span>
                </button>
                <button class="btn" onclick="handleActivity('whatsapp', 'WhatsApp Banking', true)">
                    WA Banking <span class="counter-badge" id="badge-whatsapp">0</span>
                </button>
                <button class="btn" onclick="handleActivity('yono', 'YONO Registration', true)">
                    YONO Reg <span class="counter-badge" id="badge-yono">0</span>
                </button>
                <button class="btn" onclick="handleActivity('contact', 'Contact Centre', true)">
                    Contact Centre <span class="counter-badge" id="badge-contact">0</span>
                </button>
                
                <button class="btn" onclick="openCategoryModal()" style="border-color: var(--primary-color);">
                    Other Forms Filled <span class="counter-badge" id="badge-all_forms">0</span>
                </button>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="btn btn-main-action" onclick="showReport()">VIEW FINAL REPORT</button>
        </div>
    </div>

    <div class="app-shell" id="reportView">
        <header>
            <h1>Summary</h1>
            <p>Exporting to WhatsApp</p>
        </header>
        <div class="content">
            <div class="card">
                <div id="reportContainer"></div>
                <button class="btn btn-whatsapp" onclick="shareReport()">SHARE VIA WHATSAPP</button>
                <button class="btn btn-cancel" style="margin-top:10px" onclick="hideReport()">GO BACK</button>
                <button class="btn" style="margin-top:20px; color:#EF4444; font-size:12px; justify-content:center; background:transparent; border:1px solid #EF4444;" onclick="resetCounts()">RESET ALL DATA</button>
            </div>
        </div>
    </div>

    <div id="numberModal" class="overlay">
        <div class="modal">
            <h2 id="modalTitle">Enter Details</h2>
            
            <div class="input-toggle-container">
                <div id="optPhone" class="toggle-option active" onclick="setModalType('Phone')">Phone No.</div>
                <div id="optAccount" class="toggle-option" onclick="setModalType('Account')">Account No.</div>
            </div>

            <input type="tel" inputmode="numeric" id="modalInput" placeholder="Enter number...">
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <button class="btn btn-cancel" onclick="closeModal()">BACK</button>
                <button class="btn btn-confirm" onclick="submitModal()">SAVE</button>
            </div>
        </div>
    </div>

    <div id="categoryModal" class="overlay">
        <div class="modal">
            <h2>Select Form Type</h2>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top: 20px;">
                <button class="btn" style="justify-content:center" onclick="selectForm('withdrawal', 'Withdrawal Form')">Withdrawal Form</button>
                <button class="btn" style="justify-content:center" onclick="selectForm('deposit', 'Deposit Form')">Deposit Form</button>
                <button class="btn" style="justify-content:center" onclick="selectForm('kyc', 'KYC Form')">KYC Form</button>
                <button class="btn" style="justify-content:center" onclick="selectForm('account_opening', 'A/C Opening Form')">Account Opening Form</button>
                <button class="btn" style="justify-content:center" onclick="selectForm('others', 'Misc Other Forms')">Other Forms (Misc)</button>
                <button class="btn btn-cancel" style="margin-top:12px;" onclick="closeCategoryModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        // --- DYNAMIC THEME ENGINE ---
        const themes = [
            { day: "Sunday", color: "#94A3B8", rgb: "148, 163, 184", bg: "linear-gradient(180deg, #1E293B 0%, #0F172A 100%)" },
            { day: "Monday", color: "#38BDF8", rgb: "56, 189, 248", bg: "linear-gradient(180deg, #0C4A6E 0%, #0F172A 100%)" },
            { day: "Tuesday", color: "#2DD4BF", rgb: "45, 212, 191", bg: "linear-gradient(180deg, #064E3B 0%, #0F172A 100%)" },
            { day: "Wednesday", color: "#A78BFA", rgb: "167, 139, 250", bg: "linear-gradient(180deg, #4C1D95 0%, #0F172A 100%)" },
            { day: "Thursday", color: "#F472B6", rgb: "244, 114, 182", bg: "linear-gradient(180deg, #831843 0%, #0F172A 100%)" },
            { day: "Friday", color: "#4ADE80", rgb: "74, 222, 128", bg: "linear-gradient(180deg, #064E3B 0%, #0F172A 100%)" },
            { day: "Saturday", color: "#FB923C", rgb: "251, 146, 60", bg: "linear-gradient(180deg, #7C2D12 0%, #0F172A 100%)" }
        ];

        function applyTheme() {
            const dayIndex = new Date().getDay();
            const theme = themes[dayIndex];
            const root = document.documentElement;
            root.style.setProperty('--primary-color', theme.color);
            root.style.setProperty('--primary-rgb', theme.rgb);
            root.style.setProperty('--bg-gradient', theme.bg);
            document.getElementById('dynamicTitle').innerText = "Informa " + theme.day;
        }
        applyTheme();

        // --- CORE LOGIC ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeLcVyTN-v9pEqaI9PdreobrUoPlMqMGl07epMz4ECJOBkrWtRJCXveN1hDIX5K2Yv/exec";
        
        const defaultCounts = { nps: 0, whatsapp: 0, yono: 0, contact: 0, withdrawal: 0, deposit: 0, kyc: 0, account_opening: 0, others: 0 };
        let counts = JSON.parse(localStorage.getItem('informa_counts')) || {};
        for(let key in defaultCounts) { if(counts[key] === undefined) counts[key] = 0; }

        let currentKey = "";
        let currentLabel = "";
        let currentInputType = "Phone"; // Default selection

        function updateBadges() {
            ['nps', 'whatsapp', 'yono', 'contact'].forEach(key => {
                const badge = document.getElementById('badge-' + key);
                if(badge) badge.innerText = counts[key];
            });
            const totalForms = counts.withdrawal + counts.deposit + counts.kyc + counts.account_opening + counts.others;
            document.getElementById('badge-all_forms').innerText = totalForms;
        }
        updateBadges();

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });

        function sendToSheet(sheetName, type, detail) {
            const finalUrl = `${SCRIPT_URL}?sheet=${encodeURIComponent(sheetName)}&type=${encodeURIComponent(type)}&detail=${encodeURIComponent(detail)}&time=${new Date().getTime()}`;
            new Image().src = finalUrl;
        }

        function markPresent() {
            sendToSheet("Attendance", "Present", "N/A");
            alert("Attendance Logged!");
        }

        // --- NEW MODAL SELECTION LOGIC ---
        function setModalType(type) {
            currentInputType = type;
            if(type === 'Phone') {
                document.getElementById('optPhone').classList.add('active');
                document.getElementById('optAccount').classList.remove('active');
            } else {
                document.getElementById('optAccount').classList.add('active');
                document.getElementById('optPhone').classList.remove('active');
            }
            document.getElementById('modalInput').focus();
        }

        function handleActivity(key, label, requiresInput) {
            if (requiresInput) {
                currentKey = key; currentLabel = label;
                document.getElementById('modalTitle').innerText = label;
                
                // Reset Modal to Phone by default
                setModalType('Phone');
                document.getElementById('modalInput').value = "";
                document.getElementById('numberModal').style.display = "flex";
                setTimeout(() => document.getElementById('modalInput').focus(), 150);
            } else { saveActivity(key, label, "N/A"); }
        }

        function closeModal() { document.getElementById('numberModal').style.display = "none"; }

        function submitModal() {
            let val = document.getElementById('modalInput').value;
            if (!val.trim()) return;
            closeModal();
            
            // Format the final detail string (e.g., "Phone: 9876543210")
            let formattedDetail = `${currentInputType}: ${val}`;
            saveActivity(currentKey, currentLabel, formattedDetail);
        }

        function openCategoryModal() { document.getElementById('categoryModal').style.display = "flex"; }
        function closeCategoryModal() { document.getElementById('categoryModal').style.display = "none"; }
        
        function selectForm(key, label) {
            closeCategoryModal();
            saveActivity(key, label, "N/A"); 
        }

        function saveActivity(key, label, detail) {
            counts[key]++;
            localStorage.setItem('informa_counts', JSON.stringify(counts));
            updateBadges();
            sendToSheet("Activities", label, detail);
        }

        function resetCounts() {
            if(confirm("Start fresh for tomorrow?")){
                counts = { ...defaultCounts };
                localStorage.setItem('informa_counts', JSON.stringify(counts));
                updateBadges();
                hideReport();
            }
        }

        // --- REPORT & EXPORT LOGIC ---
        function showReport() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('reportView').style.display = 'flex';
            
            const container = document.getElementById('reportContainer');
            container.innerHTML = "";
            
            const totalForms = counts.withdrawal + counts.deposit + counts.kyc + counts.account_opening + counts.others;

            const summaryDisplay = [
                { label: "NPS Forms", val: counts.nps },
                { label: "WA Banking", val: counts.whatsapp },
                { label: "YONO Reg", val: counts.yono },
                { label: "Contact Centre", val: counts.contact },
                { label: "Other Forms Filled", val: totalForms }
            ];
            
            summaryDisplay.forEach(item => {
                const row = document.createElement('div');
                row.style = "display:flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom:10px;";
                row.innerHTML = `<span>${item.label}</span> <span style="color:var(--primary-color); font-weight:800;">${item.val}</span>`;
                container.appendChild(row);
            });
        }

        function hideReport() { document.getElementById('reportView').style.display = 'none'; document.getElementById('mainView').style.display = 'flex'; }

        function shareReport() {
            const date = new Date().toLocaleDateString('en-GB');
            const totalForms = counts.withdrawal + counts.deposit + counts.kyc + counts.account_opening + counts.others;

            const text = `*Daily Report*\n` +
                         `*Date:* ${date}\n` +
                         `*Name:* Ashutosh Patnaik\n` +
                         `*Branch:* SBI Komtalpeta(17978)\n` +
                         `-------------------------\n` +
                         `NPS Forms: *${counts.nps}*\n` +
                         `WhatsApp Banking: *${counts.whatsapp}*\n` +
                         `YONO Registration: *${counts.yono}*\n` +
                         `Contact Centre: *${counts.contact}*\n` +
                         `Other Forms Filled: *${totalForms}*`;

            if (navigator.share) navigator.share({ text: text });
            else window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>
