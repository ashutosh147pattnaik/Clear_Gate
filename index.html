<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPI Bank - Advanced Ops Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary: #003366; --accent: #ffcc00; --bg: #f4f7f9; --white: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 30px; }
        
        header {
            background: var(--primary); color: white; padding: 15px;
            border-bottom: 4px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        #main-content { padding: 15px; max-width: 600px; margin: auto; }

        /* Cards and Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 450px) { .grid { grid-template-columns: 1fr; } }
        
        .card {
            background: white; padding: 15px; border-radius: 12px; text-align: center;
            border-top: 4px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .count { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: #333; }

        button { 
            padding: 14px; border: none; border-radius: 8px; font-weight: bold; 
            width: 100%; cursor: pointer; transition: 0.2s;
        }
        button:active { opacity: 0.7; transform: scale(0.98); }
        
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: #28a745; color: white; margin-top: 15px; }
        .btn-red { background: #dc3545; color: white; margin-top: 10px; }

        /* Modals */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            z-index: 2000; padding: 20px;
        }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1.1rem; }

        .hidden { display: none !important; }
        .log-time { font-size: 0.8rem; color: var(--accent); margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; letter-spacing:1px;">HPI BANK</div>
    <div id="live-clock">00:00:00</div>
</header>

<div id="main-content">
    <div id="login-page" style="text-align:center; padding-top:80px;">
        <h2 style="color:var(--primary)">Staff Portal</h2>
        <button class="btn-blue" style="width:200px;" onclick="doLogin()">Login</button>
    </div>

    <div id="dashboard" class="hidden">
        <div id="login-display" class="log-time" style="text-align:right; margin-bottom:10px; color:#666;"></div>
        <div class="grid">
            <div class="card"><h3>NPS</h3><div class="count" id="c-nps">0</div><button class="btn-blue" onclick="addSimple('NPS')">Increment</button></div>
            <div class="card"><h3>WhatsApp</h3><div class="count" id="c-wa">0</div><button class="btn-blue" onclick="askType('WhatsApp')">Action</button></div>
            <div class="card"><h3>Yono SBI</h3><div class="count" id="c-yono">0</div><button class="btn-blue" onclick="askType('Yono SBI')">Action</button></div>
            <div class="card:active"><h3>Contact</h3><div class="count" id="c-contact">0</div><button class="btn-blue" onclick="addSimple('Contact Centre')">Increment</button></div>
            <div class="card"><h3>CBDC</h3><div class="count" id="c-cbdc">0</div><button class="btn-blue" onclick="askType('CBDC')">Action</button></div>
            <div class="card"><h3>Other Forms</h3><div class="count" id="c-other">0</div><button class="btn-blue" onclick="addSimple('Other Forms')">Increment</button></div>
        </div>
        <button class="btn-green" onclick="generatePDF()">Generate Summary PDF</button>
        <button class="btn-blue" style="background:#25D366; margin-top:10px;" onclick="shareWA()">WhatsApp Summary</button>
        <button class="btn-red" onclick="resetApp()">Reset All Data</button>
    </div>
</div>

<div id="modal-sel" class="modal hidden">
    <div class="modal-content">
        <h3>Input Type</h3>
        <button class="btn-blue" style="margin-bottom:10px" onclick="openInput('Mobile Number')">Mobile Number</button>
        <button class="btn-blue" onclick="openInput('Account Number')">Account Number</button>
        <button style="background:none; color:gray; margin-top:10px" onclick="closeAll()">Cancel</button>
    </div>
</div>

<div id="modal-val" class="modal hidden">
    <div class="modal-content">
        <h3 id="val-title">Enter Digits</h3>
        <input type="number" id="val-field" placeholder="Enter number here...">
        <button class="btn-blue" onclick="saveEntry()">Save & Increment</button>
        <button style="background:none; color:gray; margin-top:10px" onclick="closeAll()">Cancel</button>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    // State logic
    let state = JSON.parse(localStorage.getItem('hpi_final_v1')) || {
        counts: { NPS: 0, WhatsApp: 0, "Yono SBI": 0, "Contact Centre": 0, CBDC: 0, "Other Forms": 0 },
        logs: [],
        loginTime: null
    };

    let activeCat = '';
    let activeType = '';

    function updateClock() {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    function doLogin() {
        if(!state.loginTime) {
            state.loginTime = new Date().toLocaleString();
        }
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('login-display').innerText = "Logged in at: " + state.loginTime;
        save();
        refreshUI();
    }

    function addSimple(cat) {
        state.counts[cat]++;
        addLog(cat, "Incremented by 1");
        save();
    }

    function askType(cat) {
        activeCat = cat;
        document.getElementById('modal-sel').classList.remove('hidden');
    }

    function openInput(type) {
        activeType = type;
        document.getElementById('modal-sel').classList.add('hidden');
        document.getElementById('val-title').innerText = "Enter " + type;
        document.getElementById('val-field').value = '';
        document.getElementById('modal-val').classList.remove('hidden');
    }

    function saveEntry() {
        const val = document.getElementById('val-field').value;
        if(!val) return alert("Please enter digits");
        
        state.counts[activeCat]++;
        addLog(`${activeCat} - ${activeType}`, val);
        save();
        closeAll();
    }

    function addLog(cat, val) {
        const timestamp = new Date().toLocaleTimeString();
        state.logs.push({ 
            id: state.logs.length + 1,
            time: timestamp,
            category: cat,
            value: val
        });
    }

    function closeAll() {
        document.querySelectorAll('.modal').forEach(m => m.classList.add('hidden'));
    }

    function save() {
        localStorage.setItem('hpi_final_v1', JSON.stringify(state));
        refreshUI();
    }

    function refreshUI() {
        document.getElementById('c-nps').innerText = state.counts['NPS'];
        document.getElementById('c-wa').innerText = state.counts['WhatsApp'];
        document.getElementById('c-yono').innerText = state.counts['Yono SBI'];
        document.getElementById('c-contact').innerText = state.counts['Contact Centre'];
        document.getElementById('c-cbdc').innerText = state.counts['CBDC'];
        document.getElementById('c-other').innerText = state.counts['Other Forms'];
    }

    function generatePDF() {
        const doc = new jsPDF();
        
        // Header
        doc.setFontSize(18);
        doc.text("HPI BANK - BRANCH SUMMARY REPORT", 14, 20);
        doc.setFontSize(10);
        doc.text(`Login Time: ${state.loginTime}`, 14, 30);
        doc.text(`Report Generated: ${new Date().toLocaleString()}`, 14, 35);

        // Build Table Data
        const body = state.logs.map(log => [
            log.id,
            `${log.category} (${log.time})`,
            log.value
        ]);

        doc.autoTable({
            startY: 45,
            head: [['S.No', 'Account / Mobile / Category', 'Input Value / Action']],
            body: body,
            theme: 'grid',
            headStyles: { fillColor: [0, 51, 102] }
        });

        doc.save(`HPI_Report_${new Date().getTime()}.pdf`);
    }

    function shareWA() {
        let txt = `*HPI BANK SUMMARY*\nLogin: ${state.loginTime}\n----------\n`;
        for(let key in state.counts) {
            txt += `${key}: ${state.counts[key]}\n`;
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
    }

    function resetApp() {
        if(confirm("Confirm: Wipe all data and logs?")) {
            state = { 
                counts: { NPS: 0, WhatsApp: 0, "Yono SBI": 0, "Contact Centre": 0, CBDC: 0, "Other Forms": 0 },
                logs: [],
                loginTime: null
            };
            localStorage.clear();
            location.reload();
        }
    }

    window.onload = () => { if(state.loginTime) doLogin(); };
</script>
</body>
</html>
