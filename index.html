<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void:         #05060d;
            --void-2:       #0b0e1c;
            --panel:        rgba(13, 17, 34, 0.55);
            --panel-border: rgba(139, 148, 219, 0.22);

            --violet:       #8b5cf6;
            --violet-dim:   rgba(139, 92, 246, 0.16);
            --cyan:         #22d3ee;
            --cyan-dim:     rgba(34, 211, 238, 0.14);

            --text-main:    #edf0fb;
            --text-muted:   #8790b3;
            --text-dim:     #4b5278;

            --r-card: 2px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spinReverse { to { transform: rotate(-360deg); } }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.5); }
            50% { opacity: 0.5; box-shadow: 0 0 0 6px rgba(34, 211, 238, 0); }
        }
        @keyframes driftStars {
            from { background-position: 0 0, 0 0; }
            to { background-position: 200px 400px, -150px 300px; }
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Sora', sans-serif;
            background: var(--void);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            position: relative;
        }

        /* Starfield + nebula wash */
        body::before {
            content: "";
            position: fixed;
            inset: -10%;
            background-image:
                radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,0.55), transparent),
                radial-gradient(1px 1px at 130px 180px, rgba(255,255,255,0.35), transparent),
                radial-gradient(1.5px 1.5px at 220px 90px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 300px 260px, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 70px 300px, rgba(255,255,255,0.4), transparent);
            background-size: 340px 380px;
            animation: driftStars 90s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 25% 15%, rgba(139, 92, 246, 0.14), transparent 60%),
                radial-gradient(ellipse 55% 45% at 80% 85%, rgba(34, 211, 238, 0.10), transparent 60%),
                radial-gradient(ellipse 80% 60% at 50% 100%, var(--void) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- Top status strip --- */
        .status-strip {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            text-transform: uppercase;
            z-index: 5;
        }
        .status-strip .dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            margin-right: 8px;
            animation: pulseDot 2.4s ease-in-out infinite;
        }
        .status-strip span.id { color: var(--text-muted); }

        /* --- Card wrapper + rotating aura --- */
        .card-wrap {
            position: relative;
            width: 90%;
            max-width: 380px;
            z-index: 2;
        }

        .aura {
            position: absolute;
            inset: -55%;
            z-index: -1;
            background: conic-gradient(from 0deg,
                transparent 0deg,
                var(--violet) 50deg,
                transparent 120deg,
                var(--cyan) 210deg,
                transparent 300deg,
                var(--violet) 360deg);
            filter: blur(48px);
            opacity: 0.4;
            animation: spin 14s linear infinite;
        }

        /* --- Gateway Card (clipped HUD corners) --- */
        .gateway-container {
            position: relative;
            background: var(--panel);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--panel-border);
            clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
            padding: 2.75rem 2.25rem 2rem;
            text-align: left;
            box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* corner brackets to reinforce the clipped-panel read */
        .gateway-container::before,
        .gateway-container::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border: 1px solid var(--cyan);
            opacity: 0.7;
            pointer-events: none;
        }
        .gateway-container::before { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .gateway-container::after  { bottom: -1px; left: -1px; border-right: none; border-top: none; }

        /* --- Emblem with orbiting rings --- */
        .emblem {
            position: relative;
            width: 56px;
            height: 56px;
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .emblem .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed var(--violet);
            opacity: 0.55;
            animation: spin 8s linear infinite;
        }
        .emblem .ring.ring-2 {
            inset: 8px;
            border: 1px solid var(--cyan);
            border-style: dotted;
            opacity: 0.6;
            animation: spinReverse 6s linear infinite;
        }
        .emblem .core {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--void-2);
            border: 1px solid var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 0.03em;
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.45);
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .eyebrow::before {
            content: "";
            width: 16px;
            height: 1px;
            background: var(--cyan);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
            background: linear-gradient(90deg, var(--text-main) 60%, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #dynamic-wish {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            min-height: 18px;
            margin-bottom: 1.75rem;
            transition: opacity 0.5s ease;
        }
        #dynamic-wish::before {
            content: "◈ ";
            color: var(--violet);
        }

        .divider {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, var(--panel-border), transparent 85%);
            margin: 0 0 1.5rem;
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            border: 1px solid var(--panel-border);
            background: rgba(139, 148, 219, 0.04);
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
            position: relative;
        }

        .nav-btn:hover {
            background: var(--cyan-dim);
            border-color: var(--cyan);
            transform: translateX(2px);
        }
        .nav-btn:active { transform: translateX(2px) scale(0.985); }

        .btn-index {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            width: 26px;
            flex-shrink: 0;
        }
        .nav-btn:hover .btn-index { color: var(--cyan); }

        .btn-text { flex: 1; min-width: 0; }
        .btn-label { display: block; font-size: 0.94rem; font-weight: 600; color: var(--text-main); }
        .btn-sub {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.03em;
        }

        .btn-arrow {
            color: var(--text-dim);
            font-size: 1.1rem;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        .nav-btn:hover .btn-arrow { transform: translateX(3px); color: var(--cyan); }

        /* --- Footer --- */
        .footer-text {
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.64rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-text .lock { color: var(--violet); }

        @media (prefers-reduced-motion: reduce) {
            .status-strip .dot, .aura, .emblem .ring, .emblem .ring-2, body::before { animation: none; }
            .gateway-container { animation: none; }
        }
    </style>
</head>
<body>

    <div class="status-strip">
        <span><span class="dot"></span>UPLINK STABLE</span>
        <span class="id">GW-SBI-04</span>
    </div>

    <div class="card-wrap">
        <div class="aura"></div>
        <div class="gateway-container">

            <div class="emblem">
                <span class="ring"></span>
                <span class="ring ring-2"></span>
                <span class="core">SBI</span>
            </div>

            <div class="eyebrow">Secure Session</div>
            <h1>Operations Gateway</h1>
            <p id="dynamic-wish">Loading workspace...</p>

            <hr class="divider">

            <div class="btn-group">
                <a href="K1.html" class="nav-btn btn-target">
                    <span class="btn-index">01</span>
                    <span class="btn-text">
                        <span class="btn-label">Target Portal</span>
                        <span class="btn-sub">Elipoma</span>
                    </span>
                    <span class="btn-arrow">→</span>
                </a>
                <a href="A1.html" class="nav-btn btn-report">
                    <span class="btn-index">02</span>
                    <span class="btn-text">
                        <span class="btn-label">Daily Report</span>
                        <span class="btn-sub">Ashutosh</span>
                    </span>
                    <span class="btn-arrow">→</span>
                </a>
            </div>

            <p class="footer-text"><span class="lock">&#128274;</span>Secure branch access &copy; 2026</p>
        </div>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead",
            "Keep up the brilliant work",
            "Stay safe and productive",
            "Let's crush our targets today",
            "Welcome back to the dashboard",
            "Wishing you massive success",
            "Your hard work is appreciated"
        ];

        window.onload = () => {
            const wishEl = document.getElementById('dynamic-wish');
            wishEl.style.opacity = 0;

            setTimeout(() => {
                wishEl.textContent = wishes[Math.floor(Math.random() * wishes.length)];
                wishEl.style.opacity = 1;
            }, 300);
        };
    </script>

</body>
</html>
