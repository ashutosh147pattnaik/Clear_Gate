<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* "Freedom of Life" Multi-Color Theme */
            --bg-freedom: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #a1c4fd 75%, #c2e9fb 100%);
            
            /* Glassmorphism Variables */
            --glass-panel: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            
            /* Vibrant UI Gradients */
            --grad-logo: linear-gradient(135deg, #fa709a 0%, #fee140 100%); /* Sunrise */
            --grad-action: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); /* Ocean Blue */
            --grad-success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); /* Life Green */

            /* Typography */
            --text-dark: #2d3748;
            --text-light: #4a5568;
            --sbi-blue: #2c3e50; 
        }

        body, html {
            height: 100%;
            width: 100%;
            display: grid;
            place-items: center;
            background: var(--bg-freedom);
            background-attachment: fixed;
            color: var(--text-dark);
        }

        /* --- Glassmorphism Gateway Card --- */
        .gateway-container {
            background: var(--glass-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .logo-placeholder {
            width: 75px;
            height: 75px;
            background: var(--grad-logo);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(250, 112, 154, 0.3);
        }

        .logo-placeholder::before { 
            content: "SBI"; 
            color: white;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        h1 {
            color: var(--sbi-blue);
            font-size: 1.6rem;
            margin-bottom: 4px;
            font-weight: 800;
        }

        #dynamic-wish {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* --- Vibrant Gradient Buttons --- */
        .nav-btn {
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-target {
            background: var(--grad-action);
            box-shadow: 0 6px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-report {
            background: var(--grad-success);
            box-shadow: 0 6px 15px rgba(56, 239, 125, 0.3);
        }

        /* Smooth touch feedback */
        .nav-btn:active {
            transform: scale(0.96);
        }

        .icon { font-size: 1.3rem; }
        
        .footer-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 600;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-placeholder"></div>
        <h1>Operations Gateway</h1>
        
        <div id="dynamic-wish">Loading workspace...</div>

        <div class="btn-group">
            <a href="K1.html" class="nav-btn btn-target">
                <span class="icon">🎯</span> Target Portal (Elipoma)
            </a>

            <a href="A1.html" class="nav-btn btn-report">
                <span class="icon">📊</span> Daily Report (Ashutosh)
            </a>
        </div>
        
        <div class="footer-text">Secure Branch Access &copy; 2026</div>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead! 🌟",
            "Keep up the brilliant work! 💼",
            "Stay safe and productive! 🛡️",
            "Let's crush our targets today! 🎯",
            "Welcome back to the dashboard! 👋",
            "Wishing you massive success! 🚀",
            "Your hard work is appreciated! 💡"
        ];

        // Pick a single random wish on page load
        window.onload = () => {
            const initialWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('dynamic-wish').textContent = initialWish;
        };
    </script>

</body>
</html>
