<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI Premium Ops Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* --- PREMIUM BANKING THEME WITH BG --- */
        :root { 
            --midnight: #002147; 
            --sbi-blue: #283593;
            --gold: #D4AF37; 
            --white: #ffffff; 
            --success-glow: #00c853; 
            --text-dark: #1A237E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; 
            /* Gradient Background Theme */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            padding-bottom: 50px;
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, var(--midnight) 0%, var(--sbi-blue) 100%);
            color: var(--white); 
            padding: 18px 20px;
            border-bottom: 4px solid var(--gold);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .bank-title { font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }

        #live-clock {
            background: rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }

        #main-content { padding: 20px; max-width: 500px; margin: auto; }

        /* Login & Card Glassmorphism */
        #login-page, .card { 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        #login-page { padding: 40px 20px; text-align: center; margin-top: 50px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        
        .card {
            padding: 18px; 
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.95); }

        .card h3 { 
            margin: 0; font-size: 0.9rem; color: var(--midnight); font-weight: 700;
            height: 40px; display: flex; align-items: center; justify-content: center;
        }

        .target-label { font-size: 0.65rem; color: #5c6bc0; font-weight: 700; display: block; margin-bottom: 5px; }

        .count { 
            font-size: 2.2rem; font-weight: 900; margin: 5px 0; color: var(--sbi-blue); 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Buttons */
        button { 
            padding: 12px; border: none; border-radius: 10px; font-weight: 800; 
            cursor: pointer; font-size: 0.8rem; width: 100%; transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-blue { background: var(--midnight); color: var(--white); box-shadow: 0 4px 0 #001530; }
        .btn-blue:active { transform: translateY(2px); box-shadow: 0 1px 0 #001530; }

        /* Glowing Target Met */
        .btn-target-met { 
            background: linear-gradient(135deg, #00e676 0%, #1de9b6 100%) !important; 
            color: #003300 !important; 
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.5) !important;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .btn-summary { 
            background: linear-gradient(135deg, var(--gold) 0%, #B8860B 100%); 
            color: var(--midnight); margin-top: 25px; 
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.4);
        }

        .btn-red { background: rgba(255, 23, 68, 0.1); color: #ff1744; margin-top: 15px; border: 1px solid rgba(255, 23, 68, 0.2); }

        /* Modals */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 21, 48, 0.8); display: flex; justify-content: center; align-items: center;
            z-index: 2000; padding: 20px; backdrop-filter: blur(8px);
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 25px; 
            width: 100%; max-width: 350px; border: 3px solid var(--gold);
        }
        
        .toggle-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .toggle-btn { background: #f1f3f4; color: #5f6368; flex: 1; border-radius: 12px; }
        .toggle-btn.active { background: var(--sbi-blue); color: white; }

        input#val-field { 
            width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #e8eaed; 
            border-radius: 15px; font-size: 1.5rem; text-align: center; color: var(--midnight);
        }

        .hidden { display: none !important; }
        .login-info-box { font-size: 0.75rem; color: #3949ab; text-align: right; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="bank-title">SBI PREMIUM</div>
    <div id="live-clock">00:00:00</div>
</header>

<div id="main-content">
    <div id="login-page">
        <h2 style="color:var(--midnight); margin-top:0;">Operations Portal</h2>
        <p style="color:#5c6bc0;">Authorized Session Access</p>
        <button class="btn-blue" style="width:160px; margin-top:20px;" onclick="doLogin()">Login & Start</button>
    </div>

    <div id="dashboard" class="hidden">
        <div id="login-timestamp-ui" class="login-info-box"></div>
        
        <div class="grid">
            <div class="card">
                <h3>NPS</h3>
                <span class="target-label">TARGET: 10</span>
                <div class="count" id="c-nps">0</div>
                <button id="btn-nps" class="btn-blue" onclick="addSimple('NPS')">Add</button>
            </div>
            
            <div class="card">
                <h3>WhatsApp</h3>
                <span class="target-label">TARGET: 15</span>
                <div class="count" id="c-wa">0</div>
                <button id="btn-wa" class="btn-blue" onclick="openUnifiedModal('WhatsApp')">Action</button>
            </div>

            <div class="card">
                <h3>Yono SBI</h3>
                <span class="target-label">TARGET: 5</span>
                <div class="count" id="c-yono">0</div>
                <button id="btn-yono" class="btn-blue" onclick="openUnifiedModal('Yono SBI')">Action</button>
            </div>

            <div class="card">
                <h3>Contact Centre</h3>
                <span class="target-label">TARGET: 10</span>
                <div class="count" id="c-contact">0</div>
                <button id="btn-contact" class="btn-blue" onclick="openUnifiedModal('Contact Centre')">Action</button>
            </div>

            <div class="card" style="grid-column: span 2;">
                <h3>CBDC</h3>
                <span class="target-label">TRACKING ONLY</span>
                <div class="count" id="c-cbdc">0</div>
                <button id="btn-cbdc" class="btn-blue" onclick="openUnifiedModal('CBDC')">Action</button>
            </div>
        </div>
        
        <button class="btn-summary" onclick="generatePDF()">Download Report & Reset</button>
        <button class="btn-blue" style="background:#25D366; box-shadow: 0 4px 0 #075E54; margin-top:10px;" onclick="shareWA()">WhatsApp Branch Sync</button>
        <button class="btn-red" onclick="resetApp()">Manual Reset</button>
    </div>
</div>

<div id="unified-modal" class="modal hidden">
    <div class="modal-content">
        <h4 id="modal-title" style="margin-top:0; text-align:center;">Secure Entry</h4>
        <div class="toggle-container">
            <button id="toggle-acc" class="toggle-btn active" onclick="setEntryType('Account Number')">Account</button>
            <button id="toggle-mob" class="toggle-btn" onclick="setEntryType('Mobile Number')">Mobile</button>
        </div>
        <input type="number" id="val-field" placeholder="Digits...">
        <button class="btn-blue" onclick="saveUnifiedEntry()" style="background:var(--sbi-blue);">Save Entry</button>
        <button style="background:none; color:#757575; margin-top:15px;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    const TARGETS = { 'NPS': 10, 'WhatsApp': 15, 'Yono SBI': 5, 'Contact Centre': 10 };

    let state = JSON.parse(localStorage.getItem('sbi_v15_bg')) || {
        counts: { NPS: 0, WhatsApp: 0, "Yono SBI": 0, "Contact Centre": 0, CBDC: 0, "Other Forms": 0 },
        logs: [], loginTime: null,
        brName: "SBI KOMTALPETA", brCode: "17978", userName: "ASHUTOSH PATTNAIK"
    };

    let activeCat = '';
    let selectedType = 'Account Number';

    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(); }, 1000);

    function doLogin() {
        if (!state.loginTime) state.loginTime = new Date().toLocaleTimeString();
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('login-timestamp-ui').innerText = "Session: " + state.loginTime;
        save();
        refreshUI();
    }

    function addSimple(cat) {
        state.counts[cat]++;
        state.logs.push({ id: state.logs.length + 1, cat: cat, val: "Increment +1", time: new Date().toLocaleTimeString() });
        save();
    }

    function openUnifiedModal(cat) {
        activeCat = cat;
        document.getElementById('modal-title').innerText = cat;
        document.getElementById('val-field').value = '';
        setEntryType('Account Number');
        document.getElementById('unified-modal').classList.remove('hidden');
        setTimeout(() => document.getElementById('val-field').focus(), 100);
    }

    function setEntryType(type) {
        selectedType = type;
        document.getElementById('toggle-acc').className = (type === 'Account Number') ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('toggle-mob').className = (type === 'Mobile Number') ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('val-field').placeholder = type.split(' ')[0] + "...";
    }

    function saveUnifiedEntry() {
        const val = document.getElementById('val-field').value;
        if(!val) return alert("Digits Required");
        state.counts[activeCat]++;
        state.logs.push({ id: state.logs.length + 1, cat: `${activeCat} (${selectedType})`, val: val, time: new Date().toLocaleTimeString() });
        save();
        closeModal();
    }

    function closeModal() { document.getElementById('unified-modal').classList.add('hidden'); }
    function save() { localStorage.setItem('sbi_v15_bg', JSON.stringify(state)); refreshUI(); }

    function refreshUI() {
        const mapping = { 'NPS': 'nps', 'WhatsApp': 'wa', 'Yono SBI': 'yono', 'Contact Centre': 'contact', 'CBDC': 'cbdc' };
        for(let key in mapping) {
            const count = state.counts[key];
            const shortKey = mapping[key];
            const el = document.getElementById('c-' + shortKey);
            if (el) el.innerText = count;
            
            const btn = document.getElementById('btn-' + shortKey);
            if (btn) {
                if (TARGETS[key] && count >= TARGETS[key]) btn.classList.add('btn-target-met');
                else btn.classList.remove('btn-target-met');
            }
        }
    }

    function generatePDF() {
        if (state.logs.length === 0) { alert("Nothing to export."); return; }
        const doc = new jsPDF();
        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        
        doc.setFontSize(18); doc.setTextColor(0, 33, 71); doc.text("SBI PREMIUM LOG REPORT", 14, 20);
        doc.setFontSize(10); doc.setTextColor(100); 
        doc.text(`Staff: ${state.userName} | Login: ${state.loginTime}`, 14, 30);
        doc.text(`Date: ${d}/${m}/${y}`, 14, 35);
        
        doc.autoTable({
            startY: 40,
            head: [['REF', 'TASK [TIME]', 'VALUE']],
            body: state.logs.map(l => [l.id, `${l.cat} [${l.time}]`, l.val]),
            headStyles: { fillColor: [0, 33, 71] },
            theme: 'grid'
        });

        doc.save(`SB_REPORT_${d}_${m}_${y}.pdf`);

        setTimeout(() => {
            localStorage.clear();
            alert("Report Exported. Session Reset.");
            location.reload();
        }, 1500);
    }

    function shareWA() {
        const msg = `*SBI PREMIUM LOG*\n
