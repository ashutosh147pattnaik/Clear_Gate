<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Compact Ops</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { 
            --primary: #003366; 
            --accent: #ffcc00; 
            --bg: #f0f2f5; 
            --white: #ffffff; 
            --success: #27ae60; 
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg);
            height: 100vh;
            overflow: hidden; /* Prevents accidental scrolling */
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: var(--primary); 
            color: white; 
            padding: 8px 15px;
            border-bottom: 3px solid var(--accent);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0;
        }

        .logo-text { font-weight: 800; font-size: 0.9rem; }
        #live-clock { font-family: monospace; font-size: 0.85rem; }

        #main-content { 
            flex-grow: 1;
            padding: 10px; 
            max-width: 500px; 
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        /* Dashboard Grid */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin-bottom: 10px;
        }
        
        .card {
            background: var(--white);
            padding: 10px; 
            border-radius: 12px; 
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }

        .card h3 { font-size: 0.85rem; color: var(--primary); margin-bottom: 2px; }
        .target-label { font-size: 0.65rem; color: #777; }
        .count { font-size: 1.5rem; font-weight: 800; margin: 2px 0; color: #222; }

        .progress-container { background: #eee; height: 4px; border-radius: 2px; margin: 5px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; }

        button { 
            padding: 8px; border: none; border-radius: 6px; 
            font-weight: 700; cursor: pointer; font-size: 0.8rem; 
            width: 100%;
        }
        
        .btn-blue { background: var(--primary); color: white; }
        .btn-target-met { background: var(--success) !important; color: white; }

        .footer-actions { display: flex; flex-direction: column; gap: 6px; }
        .btn-summary { background: var(--success); color: white; }
        .btn-wa { background: #25D366; color: white; }
        .btn-red { background: none; color: var(--danger); font-size: 0.7rem; padding: 2px; text-decoration: underline; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; }
        
        .toggle-container { display: flex; gap: 5px; margin-bottom: 15px; }
        .toggle-btn { background: #f0f0f0; color: #666; flex: 1; padding: 8px; border-radius: 5px; font-size: 0.75rem; }
        .toggle-btn.active { background: var(--primary); color: white; }

        input#val-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }

        .hidden { display: none !important; }
        .status-bar { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">SBI BANK</div>
    <div id="live-clock">00:00:00</div>
</header>

<div id="main-content">
    <div id="login-page" style="text-align:center;">
        <h2 style="color:var(--primary); margin-bottom: 20px;">Ops Portal</h2>
        <button class="btn-blue" style="width:150px;" onclick="doLogin()">Login</button>
    </div>

    <div id="dashboard" class="hidden">
        <div id="login-timestamp-ui" class="status-bar"></div>
        
        <div class="grid">
            <div class="card">
                <h3>NPS</h3>
                <span class="target-label">T: 10</span>
                <div class="count" id="c-nps">0</div>
                <div class="progress-container"><div id="p-nps" class="progress-bar"></div></div>
                <button id="btn-nps" class="btn-blue" onclick="addSimple('NPS')">Add</button>
            </div>
            
            <div class="card">
                <h3>WhatsApp</h3>
                <span class="target-label">T: 15</span>
                <div class="count" id="c-wa">0</div>
                <div class="progress-container"><div id="p-wa" class="progress-bar"></div></div>
                <button id="btn-wa" class="btn-blue" onclick="openUnifiedModal('WhatsApp')">Record</button>
            </div>

            <div class="card">
                <h3>Yono SBI</h3>
                <span class="target-label">T: 5</span>
                <div class="count" id="c-yono">0</div>
                <div class="progress-container"><div id="p-yono" class="progress-bar"></div></div>
                <button id="btn-yono" class="btn-blue" onclick="openUnifiedModal('Yono SBI')">Record</button>
            </div>

            <div class="card">
                <h3>Contact</h3>
                <span class="target-label">T: 10</span>
                <div class="count" id="c-contact">0</div>
                <div class="progress-container"><div id="p-contact" class="progress-bar"></div></div>
                <button id="btn-contact" class="btn-blue" onclick="openUnifiedModal('Contact Centre')">Record</button>
            </div>
        </div>
        
        <div class="footer-actions">
            <button class="btn-summary" onclick="generatePDF()">PDF & Reset</button>
            <button class="btn-wa" onclick="shareWA()">WhatsApp Share</button>
        </div>
    </div>
</div>

<div id="unified-modal" class="modal hidden">
    <div class="modal-content">
        <h4 id="modal-title" style="margin-bottom:10px;">Entry</h4>
        <div class="toggle-container">
            <button id="toggle-acc" class="toggle-btn active" onclick="setEntryType('Account Number')">Acc</button>
            <button id="toggle-mob" class="toggle-btn" onclick="setEntryType('Mobile Number')">Mob</button>
        </div>
        <input type="number" id="val-field" placeholder="Digits" inputmode="numeric">
        <button class="btn-blue" onclick="saveUnifiedEntry()">Save</button>
        <button style="background:none; color:gray; margin-top:10px;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    const TARGETS = { 'NPS': 10, 'WhatsApp': 15, 'Yono SBI': 5, 'Contact Centre': 10 };

    let state = JSON.parse(localStorage.getItem('sbi_v16')) || {
        counts: { NPS: 0, WhatsApp: 0, "Yono SBI": 0, "Contact Centre": 0, "Other Forms": 0 },
        logs: [], loginTime: null,
        brName: "SBI KOMTALPETA", brCode: "17978", userName: "ASHUTOSH PATTNAIK"
    };

    let activeCat = '';
    let selectedType = 'Account Number';

    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(); }, 1000);

    function doLogin() {
        if (!state.loginTime) state.loginTime = new Date().toLocaleTimeString();
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('login-timestamp-ui').innerText = "Logged in: " + state.loginTime;
        save();
    }

    function addSimple(cat) {
        state.counts[cat]++;
        state.logs.push({ id: state.logs.length + 1, cat: cat, val: "Direct", time: new Date().toLocaleTimeString() });
        save();
    }

    function openUnifiedModal(cat) {
        activeCat = cat;
        document.getElementById('modal-title').innerText = cat;
        document.getElementById('val-field').value = '';
        document.getElementById('unified-modal').classList.remove('hidden');
        document.getElementById('val-field').focus();
    }

    function setEntryType(type) {
        selectedType = type;
        document.getElementById('toggle-acc').className = (type === 'Account Number') ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('toggle-mob').className = (type === 'Mobile Number') ? 'toggle-btn active' : 'toggle-btn';
    }

    function saveUnifiedEntry() {
        const val = document.getElementById('val-field').value;
        if(!val) return alert("Empty");
        state.counts[activeCat]++;
        state.logs.push({ id: state.logs.length+1, cat: `${activeCat} (${selectedType})`, val: val, time: new Date().toLocaleTimeString() });
        save();
        closeModal();
    }

    function closeModal() { document.getElementById('unified-modal').classList.add('hidden'); }
    function save() { localStorage.setItem('sbi_v16', JSON.stringify(state)); refreshUI(); }

    function refreshUI() {
        const mapping = { 'NPS': 'nps', 'WhatsApp': 'wa', 'Yono SBI': 'yono', 'Contact Centre': 'contact' };
        for(let key in mapping) {
            const count = state.counts[key];
            const shortKey = mapping[key];
            document.getElementById('c-' + shortKey).innerText = count;
            
            const perc = Math.min((count / TARGETS[key]) * 100, 100);
            document.getElementById('p-' + shortKey).style.width = perc + "%";
            
            const btn = document.getElementById('btn-' + shortKey);
            if (count >= TARGETS[key]) btn.classList.add('btn-target-met');
            else btn.classList.remove('btn-target-met');
        }
    }

    function generatePDF() {
        const doc = new jsPDF();
        doc.text("SBI SUMMARY", 14, 20);
        doc.autoTable({
            startY: 30,
            head: [['ID', 'Activity', 'Value']],
            body: state.logs.map(l => [l.id, l.cat, l.val]),
        });
        doc.save(`SBI_Report.pdf`);
        setTimeout(() => { localStorage.clear(); location.reload(); }, 1000);
    }

    function shareWA() {
        const msg = `SBI Report\nNPS: ${state.counts.NPS}\nWA: ${state.counts.WhatsApp}\nYono: ${state.counts['Yono SBI']}\nContact: ${state.counts['Contact Centre']}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
    }

    function resetApp() { if(confirm("Reset?")) { localStorage.clear(); location.reload(); } }
    window.onload = () => { if(state.loginTime) doLogin(); };
</script>
</body>
</html>
