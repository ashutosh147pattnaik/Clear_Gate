<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Informa v2.0</title>
    <style>
        :root {
            --bg-color: #F0F4F8;
            --primary-blue: #2D5BFF;
            --deep-navy: #1A2B49;
            --success-green: #00C897;
            --warning-orange: #FF8A00;
            --white: #FFFFFF;
            --text-dark: #2D3748;
            --text-light: #718096;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            overscroll-behavior: none; /* Prevents annoying pull-to-refresh */
        }

        .app-shell {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Modern Header */
        header {
            background: var(--white);
            padding: 24px 20px;
            text-align: left;
            border-bottom: 1px solid #E2E8F0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: var(--deep-navy);
            letter-spacing: -0.5px;
        }

        header p {
            margin: 4px 0 0;
            font-size: 14px;
            color: var(--text-light);
        }

        /* Content Area */
        .content {
            padding: 16px;
            flex-grow: 1;
        }

        .section-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-light);
            margin: 20px 0 12px 4px;
            letter-spacing: 1px;
        }

        /* Card Component */
        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        /* Custom Button Styling */
        .btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            background: #F7FAFC;
            color: var(--deep-navy);
            border: 1px solid #EDF2F7;
        }

        .btn:active {
            transform: scale(0.96);
            background: #EDF2F7;
        }

        .btn-attendance {
            background: var(--success-green);
            color: white;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 200, 151, 0.2);
        }

        .btn-attendance:active { background: #00AA81; }

        /* Badge Styling */
        .counter-badge {
            background: var(--primary-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 13px;
        }

        /* Navigation Bar / Bottom Action */
        .bottom-nav {
            padding: 20px;
            background: transparent;
            position: sticky;
            bottom: 0;
        }

        .btn-main-action {
            background: var(--deep-navy);
            color: white;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(26, 43, 73, 0.2);
            font-size: 18px;
            height: 64px;
        }

        /* Modal / Overlay UI */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 43, 73, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 340px;
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal h2 { margin-top: 0; font-size: 20px; color: var(--deep-navy); }

        .modal input {
            width: 100%;
            padding: 16px;
            font-size: 24px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            text-align: center;
            margin: 20px 0;
            outline: none;
            color: var(--primary-blue);
            font-weight: 700;
        }

        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-cancel { background: #EDF2F7; color: var(--text-light); justify-content: center; }
        .btn-confirm { background: var(--primary-blue); color: white; justify-content: center; }

        /* Report Styles */
        .report-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #F7FAFC;
        }
        .report-item:last-child { border-bottom: none; }
        .report-val { font-weight: 800; color: var(--primary-blue); }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            justify-content: center;
            margin-top: 24px;
        }

        #reportView { display: none; }
    </style>
</head>
<body>

    <div class="app-shell" id="mainView">
        <header>
            <h1>Informa</h1>
            <p id="currentDate"></p>
        </header>

        <div class="content">
            <div class="section-label">Shift Start</div>
            <div class="card">
                <button class="btn btn-attendance" onclick="markPresent()">Check In / Present</button>
            </div>

            <div class="section-label">Operations</div>
            <div class="card">
                <button class="btn" onclick="handleActivity('nps', 'NPS', true)">
                    NPS <span class="counter-badge" id="badge-nps">0</span>
                </button>
                <button class="btn" onclick="handleActivity('whatsapp', 'WhatsApp Banking', true)">
                    WhatsApp <span class="counter-badge" id="badge-whatsapp">0</span>
                </button>
                <button class="btn" onclick="handleActivity('yammer', 'Yammer Registration', true)">
                    Yammer <span class="counter-badge" id="badge-yammer">0</span>
                </button>
                <button class="btn" onclick="handleActivity('contact', 'Customer Contact', true)">
                    Contact <span class="counter-badge" id="badge-contact">0</span>
                </button>
                <button class="btn" onclick="handleActivity('others', 'Other Forms', false)">
                    Others <span class="counter-badge" id="badge-others">0</span>
                </button>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="btn btn-main-action" onclick="showReport()">Generate Daily Report</button>
        </div>
    </div>

    <div class="app-shell" id="reportView">
        <header>
            <h1>Daily Summary</h1>
            <p>Export your activities</p>
        </header>
        <div class="content">
            <div class="card">
                <div class="report-item"><span>NPS Total</span> <span class="report-val" id="rep-nps">0</span></div>
                <div class="report-item"><span>WhatsApp Total</span> <span class="report-val" id="rep-whatsapp">0</span></div>
                <div class="report-item"><span>Yammer Total</span> <span class="report-val" id="rep-yammer">0</span></div>
                <div class="report-item"><span>Contact Total</span> <span class="report-val" id="rep-contact">0</span></div>
                <div class="report-item"><span>Others Total</span> <span class="report-val" id="rep-others">0</span></div>
                
                <button class="btn btn-whatsapp" onclick="shareReport()">Share on WhatsApp</button>
                <button class="btn btn-cancel" style="margin-top:10px" onclick="hideReport()">Edit Tasks</button>
            </div>
        </div>
    </div>

    <div id="numberModal" class="overlay">
        <div class="modal">
            <h2 id="modalTitle">Enter Number</h2>
            <input type="tel" inputmode="numeric" id="modalInput" placeholder="••••••••">
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModal()">Back</button>
                <button class="btn btn-confirm" onclick="submitModal()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDsf-JisblzD0mvVvFnrzCkDnwbij_9jHQdOlDVHoDwPzLyrtvHsSyngXXaUbJqyvz/exec";
        let counts = { nps: 0, whatsapp: 0, yammer: 0, contact: 0, others: 0 };
        let currentKey = "";
        let currentLabel = "";

        // Set Date
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });

        function sendToSheet(sheetName, type, detail) {
            const finalUrl = `${SCRIPT_URL}?sheet=${encodeURIComponent(sheetName)}&type=${encodeURIComponent(type)}&detail=${encodeURIComponent(detail)}&time=${new Date().getTime()}`;
            const img = new Image();
            img.src = finalUrl;
        }

        function markPresent() {
            sendToSheet("Attendance", "Present", "N/A");
            alert("Attendance Logged Successfully!");
        }

        function handleActivity(key, label, requiresInput) {
            if (requiresInput) {
                currentKey = key;
                currentLabel = label;
                document.getElementById('modalTitle').innerText = label;
                document.getElementById('modalInput').value = "";
                document.getElementById('numberModal').style.display = "flex";
                setTimeout(() => document.getElementById('modalInput').focus(), 100);
            } else {
                saveActivity(key, label, "N/A");
            }
        }

        function closeModal() { document.getElementById('numberModal').style.display = "none"; }

        function submitModal() {
            let val = document.getElementById('modalInput').value;
            if (!val.trim()) return alert("Enter a valid value");
            closeModal();
            saveActivity(currentKey, currentLabel, val);
        }

        function saveActivity(key, label, detail) {
            counts[key]++;
            document.getElementById('badge-' + key).innerText = counts[key];
            sendToSheet("Activities", label, detail);
        }

        function showReport() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('reportView').style.display = 'flex';
            Object.keys(counts).forEach(k => document.getElementById('rep-' + k).innerText = counts[k]);
        }

        function hideReport() {
            document.getElementById('reportView').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        }

        function shareReport() {
            const text = `*Informa Report - ${new Date().toLocaleDateString()}*\n\nNPS: *${counts.nps}*\nWhatsApp: *${counts.whatsapp}*\nYammer: *${counts.yammer}*\nContact: *${counts.contact}*\nOthers: *${counts.others}*`;
            if (navigator.share) navigator.share({ text: text });
            else window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>
