<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBI Operations Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#05060d;--void-2:#0b0e1c;--panel:rgba(13,17,34,.55);--panel-border:rgba(139,148,219,.22);--violet:#8b5cf6;--violet-dim:rgba(139,92,246,.16);--cyan:#22d3ee;--cyan-dim:rgba(34,211,238,.14);--text-main:#edf0fb;--text-muted:#8790b3;--text-dim:#4b5278;--gold:#ffd479;--rose:#ff7eb6}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,211,238,.5)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(34,211,238,0)}}
@keyframes driftStars{from{background-position:0 0,0 0}to{background-position:200px 400px,-150px 300px}}
body,html{height:100%;width:100%;font-family:'Sora',sans-serif;background:var(--void);color:var(--text-main);overflow-x:hidden}
body{display:grid;place-items:center;align-items:safe center;overflow-y:auto;position:relative}
body::before{content:"";position:fixed;inset:-10%;background-image:radial-gradient(1px 1px at 40px 60px,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 130px 180px,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 220px 90px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 300px 260px,rgba(255,255,255,.3),transparent),radial-gradient(1.5px 1.5px at 70px 300px,rgba(255,255,255,.4),transparent);background-size:340px 380px;animation:driftStars 90s linear infinite;pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 25% 15%,rgba(139,92,246,.14),transparent 60%),radial-gradient(ellipse 55% 45% at 80% 85%,rgba(34,211,238,.10),transparent 60%),radial-gradient(ellipse 80% 60% at 50% 100%,var(--void) 0%,transparent 70%);pointer-events:none;z-index:0}
.status-strip{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;z-index:5}
.status-strip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:8px;animation:pulseDot 2.4s ease-in-out infinite}
.status-strip span.id{color:var(--text-muted)}
.card-wrap{position:relative;width:90%;max-width:380px;z-index:2;margin:56px 0 24px}
.aura{position:absolute;inset:-55%;z-index:-1;background:conic-gradient(from 0deg,transparent 0deg,var(--violet) 50deg,transparent 120deg,var(--cyan) 210deg,transparent 300deg,var(--violet) 360deg);filter:blur(48px);opacity:.4;animation:spin 14s linear infinite}
.gateway-container{position:relative;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--panel-border);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);padding:2.75rem 2.25rem 2rem;text-align:left;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards}
.gateway-container::before,.gateway-container::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--cyan);opacity:.7;pointer-events:none}
.gateway-container::before{top:-1px;right:-1px;border-left:none;border-bottom:none}
.gateway-container::after{bottom:-1px;left:-1px;border-right:none;border-top:none}
.emblem{position:relative;width:56px;height:56px;margin-bottom:1.4rem;display:flex;align-items:center;justify-content:center}
.emblem .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--violet);opacity:.55;animation:spin 8s linear infinite}
.emblem .ring.ring-2{inset:8px;border:1px dotted var(--cyan);opacity:.6;animation:spinReverse 6s linear infinite}
.emblem .core{width:30px;height:30px;border-radius:50%;background:var(--void-2);border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;color:var(--cyan);letter-spacing:.03em;box-shadow:0 0 16px rgba(34,211,238,.45)}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--cyan)}
h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;letter-spacing:-.01em;background:linear-gradient(90deg,var(--text-main) 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#dynamic-wish{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text-muted);min-height:18px;margin-bottom:1.75rem;transition:opacity .5s ease}
#dynamic-wish::before{content:"◈ ";color:var(--violet)}
.divider{border:none;height:1px;background:linear-gradient(90deg,var(--panel-border),transparent 85%);margin:0 0 1.5rem}
.btn-group{display:flex;flex-direction:column;gap:10px}
.nav-btn{display:flex;align-items:center;gap:14px;padding:14px 16px;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);border:1px solid var(--panel-border);background:rgba(139,148,219,.04);color:var(--text-main);text-decoration:none;cursor:pointer;transition:border-color .25s ease,background .25s ease,transform .25s ease;position:relative}
.nav-btn:hover{background:var(--cyan-dim);border-color:var(--cyan);transform:translateX(2px)}
.nav-btn:active{transform:translateX(2px) scale(.985)}
.btn-index{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-dim);width:26px;flex-shrink:0}
.nav-btn:hover .btn-index{color:var(--cyan)}
.btn-text{flex:1;min-width:0}
.btn-label{display:block;font-size:.94rem;font-weight:600;color:var(--text-main)}
.btn-sub{display:block;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-dim);margin-top:2px;letter-spacing:.03em}
.btn-arrow{color:var(--text-dim);font-size:1.1rem;transition:transform .25s ease,color .25s ease}
.nav-btn:hover .btn-arrow{transform:translateX(3px);color:var(--cyan)}
/* Surprise button: tiny birthday party */
@keyframes shim{to{background-position:-200% 0}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(90px) rotate(540deg);opacity:0}}
@keyframes up{0%{transform:translateY(0) translateX(0);opacity:1}100%{transform:translateY(-95px) translateX(10px);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg) scale(1.15)}}
@keyframes glowp{50%{box-shadow:0 0 22px rgba(255,212,121,.55),inset 0 0 14px rgba(255,126,182,.25)}}
.surprise{overflow:hidden;border-color:rgba(255,212,121,.7);background:linear-gradient(90deg,rgba(255,212,121,.16),rgba(255,126,182,.2),rgba(255,212,121,.16));background-size:200% 100%;animation:shim 3s linear infinite,glowp 2.2s ease-in-out infinite;margin-top:6px}
.surprise:hover{border-color:var(--rose);background:linear-gradient(90deg,rgba(255,212,121,.26),rgba(255,126,182,.3),rgba(255,212,121,.26));background-size:200% 100%}
.surprise .btn-label{background:linear-gradient(90deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.surprise .btn-sub{color:var(--text-muted)}
.surprise .gift{font-size:1.5rem;width:30px;color:inherit;display:inline-block;animation:hop 1.1s ease-in-out infinite}
.surprise .btn-arrow{color:var(--gold);display:inline-block;animation:hop 1.1s .3s ease-in-out infinite}
.party{position:absolute;inset:0;pointer-events:none}
.party i{position:absolute;top:-10px;left:var(--x);width:5px;height:9px;background:var(--c);border-radius:1px;animation:fall 2.6s linear infinite var(--d)}
.party b{position:absolute;bottom:-22px;left:var(--x);font-size:1.05rem;animation:up 4s ease-in infinite var(--d)}
.surprise>:not(.party){position:relative}
.footer-text{margin-top:2rem;font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--text-dim);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.footer-text .lock{color:var(--violet)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.status-strip .dot,.aura,.emblem .ring,.emblem .ring-2,body::before,.party,.surprise,.surprise .gift,.surprise .btn-arrow{animation:none}.gateway-container{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="status-strip"><span><span class="dot"></span>UPLINK STABLE</span><span class="id">GW-SBI-04</span></div>
<div class="card-wrap">
<div class="aura"></div>
<div class="gateway-container">
<div class="emblem"><span class="ring"></span><span class="ring ring-2"></span><span class="core">SBI</span></div>
<div class="eyebrow">Secure Session</div>
<h1>Operations Gateway</h1>
<p id="dynamic-wish">Loading workspace...</p>
<hr class="divider">
<div class="btn-group">
<a href="K1.html" class="nav-btn btn-target"><span class="btn-index">01</span><span class="btn-text"><span class="btn-label">Target Portal</span><span class="btn-sub">Elipoma</span></span><span class="btn-arrow">→</span></a>
<a href="A1.html" class="nav-btn btn-report"><span class="btn-index">02</span><span class="btn-text"><span class="btn-label">Daily Report</span><span class="btn-sub">Ashutosh</span></span><span class="btn-arrow">→</span></a>
<a href="surprise.html" class="nav-btn surprise" id="surprise" aria-label="A surprise is waiting. Tap to open.">
<span class="party" id="party"></span>
<span class="btn-index gift">🎁</span>
<span class="btn-text"><span class="btn-label">A Surprise Is Waiting</span><span class="btn-sub">Tap to open</span></span>
<span class="btn-arrow">🎉</span>
</a>
</div>
<p class="footer-text"><span class="lock">&#128274;</span>Secure branch access &copy; 2026</p>
</div>
</div>
<script>
const wishes=["Have a fantastic day ahead","Keep up the brilliant work","Stay safe and productive","Let's crush our targets today","Welcome back to the dashboard","Wishing you massive success","Your hard work is appreciated"];
window.onload=()=>{const w=document.getElementById('dynamic-wish');w.style.opacity=0;setTimeout(()=>{w.textContent=wishes[Math.floor(Math.random()*wishes.length)];w.style.opacity=1},300)};
/* party inside the button */
const cols=['#ffd479','#ff7eb6','#22d3ee','#8b5cf6','#fff'],P=document.getElementById('party');
for(let i=0;i<14;i++)P.insertAdjacentHTML('beforeend',`<i style="--x:${Math.random()*96}%;--d:${(Math.random()*2.6).toFixed(2)}s;--c:${cols[i%5]}"></i>`);
['🎈','🎈','🎈','🎈'].forEach((b,k)=>P.insertAdjacentHTML('beforeend',`<b style="--x:${12+k*24}%;--d:${k*1.1}s">${b}</b>`));
/* full-screen confetti on tap, then open the surprise */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
document.getElementById('surprise').addEventListener('click',e=>{
 e.preventDefault();const href=e.currentTarget.href;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){location.href=href;return}
 cv.width=innerWidth;cv.height=innerHeight;const r=e.currentTarget.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
 const ps=Array.from({length:160},()=>{const a=Math.random()*Math.PI*2,s=4+Math.random()*9;return{x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*5,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}});
 let t=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.985;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()});if(++t<80)requestAnimationFrame(f)})();
 setTimeout(()=>location.href=href,1300);
});
</script>
</body>
</html>
