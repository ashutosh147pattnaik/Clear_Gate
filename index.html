<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:          #0a0e17;
            --ink-2:        #0f1522;
            --panel:        #10182a;
            --panel-border: rgba(148, 197, 255, 0.14);
            --line:         rgba(148, 197, 255, 0.08);

            --teal:         #2dd4bf;
            --teal-dim:     rgba(45, 212, 191, 0.16);
            --amber:        #f5a623;

            --text-main:    #eaf1fb;
            --text-muted:   #7c8aa3;
            --text-dim:     #4b5872;

            --r-card: 6px;
            --r-btn: 3px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Space Grotesk', sans-serif;
            background: var(--ink);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            position: relative;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 42px 42px;
            background-position: center;
        }

        /* radial ink pooling to keep the grid from feeling flat */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 20%, rgba(45, 212, 191, 0.07), transparent 55%),
                        radial-gradient(ellipse at 50% 100%, rgba(10, 14, 23, 0.9), var(--ink) 70%);
            pointer-events: none;
        }

        /* --- Top status strip --- */
        .status-strip {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            text-transform: uppercase;
            z-index: 5;
        }

        .status-strip .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--teal);
            margin-right: 8px;
            box-shadow: 0 0 8px var(--teal);
            animation: blink 2.2s ease-in-out infinite;
        }

        .status-strip span.id { color: var(--text-muted); }

        /* --- Gateway Card --- */
        .gateway-container {
            position: relative;
            background: linear-gradient(180deg, var(--panel), var(--ink-2));
            border: 1px solid var(--panel-border);
            border-radius: var(--r-card);
            padding: 2.75rem 2.25rem 2rem;
            width: 90%;
            max-width: 380px;
            text-align: left;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        /* corner ticks — instrumentation detail, not decoration */
        .gateway-container::before,
        .gateway-container::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border: 1px solid var(--teal);
            opacity: 0.55;
        }
        .gateway-container::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .gateway-container::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 60%;
            background: linear-gradient(180deg, transparent, rgba(45, 212, 191, 0.05), transparent);
            animation: scan 6s linear infinite;
            pointer-events: none;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--teal);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow::before {
            content: "";
            width: 18px;
            height: 1px;
            background: var(--teal);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        #dynamic-wish {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            min-height: 18px;
            margin-bottom: 1.75rem;
            transition: opacity 0.5s ease;
        }

        #dynamic-wish::before {
            content: "> ";
            color: var(--teal);
        }

        .divider {
            border: none;
            border-top: 1px solid var(--line);
            margin: 0 0 1.5rem;
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: var(--r-btn);
            border: 1px solid var(--panel-border);
            background: rgba(148, 197, 255, 0.03);
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
            position: relative;
        }

        .nav-btn:hover {
            background: var(--teal-dim);
            border-color: var(--teal);
            transform: translateX(2px);
        }

        .nav-btn:active {
            transform: translateX(2px) scale(0.985);
        }

        .btn-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            width: 20px;
            flex-shrink: 0;
        }

        .nav-btn:hover .btn-index { color: var(--teal); }

        .btn-text { flex: 1; min-width: 0; }

        .btn-label {
            display: block;
            font-size: 0.94rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-sub {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.03em;
        }

        .btn-arrow {
            color: var(--text-dim);
            font-size: 1.1rem;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .nav-btn:hover .btn-arrow {
            transform: translateX(3px);
            color: var(--teal);
        }

        /* --- Footer --- */
        .footer-text {
            margin-top: 2rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-text .lock { color: var(--teal); }

        @media (prefers-reduced-motion: reduce) {
            .status-strip .dot, .scan-line { animation: none; }
            .gateway-container { animation: none; }
        }
    </style>
</head>
<body>

    <div class="status-strip">
        <span><span class="dot"></span>SYSTEM ONLINE</span>
        <span class="id">GW-SBI-04</span>
    </div>

    <div class="gateway-container">
        <div class="scan-line"></div>

        <div class="eyebrow">Secure Session</div>
        <h1>Operations Gateway</h1>
        <p id="dynamic-wish">Loading workspace...</p>

        <hr class="divider">

        <div class="btn-group">
            <a href="K1.html" class="nav-btn btn-target">
                <span class="btn-index">01</span>
                <span class="btn-text">
                    <span class="btn-label">Target Portal</span>
                    <span class="btn-sub">Elipoma</span>
                </span>
                <span class="btn-arrow">→</span>
            </a>
            <a href="A1.html" class="nav-btn btn-report">
                <span class="btn-index">02</span>
                <span class="btn-text">
                    <span class="btn-label">Daily Report</span>
                    <span class="btn-sub">Ashutosh</span>
                </span>
                <span class="btn-arrow">→</span>
            </a>
        </div>

        <p class="footer-text"><span class="lock">&#128274;</span>Secure branch access &copy; 2026</p>
    </div>

    <script>
        const wishes = [
            "Have a fantastic day ahead",
            "Keep up the brilliant work",
            "Stay safe and productive",
            "Let's crush our targets today",
            "Welcome back to the dashboard",
            "Wishing you massive success",
            "Your hard work is appreciated"
        ];

        window.onload = () => {
            const wishEl = document.getElementById('dynamic-wish');
            wishEl.style.opacity = 0;

            setTimeout(() => {
                wishEl.textContent = wishes[Math.floor(Math.random() * wishes.length)];
                wishEl.style.opacity = 1;
            }, 300);
        };
    </script>

</body>
</html>
