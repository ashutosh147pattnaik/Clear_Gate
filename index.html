<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBI Operations Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #002855, #0052a3, #0a4fa6, #001f40);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gateway-container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            text-align: center;
            width: 90%;
            max-width: 380px;
            /* Gentle Floating Animation combined with initial Fade In */
            animation: fadeIn 0.8s ease-out, floatCard 6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .logo-placeholder {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #003f87, #0a4fa6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #d4af37;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            /* Pulsing Gold Glow */
            box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5);
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .logo-placeholder::before {
            content: "SBI";
        }

        h1 {
            color: #002855;
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Dynamic Wish Text Styling */
        #dynamic-wish {
            color: #0a4fa6;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 24px; /* Prevents jumping when text changes */
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-btn {
            background: white;
            color: #003f87;
            border: 2px solid #e0e5eb;
            padding: 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .btn-target {
            background: linear-gradient(135deg, #003f87, #0052a3);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 63, 135, 0.2);
        }

        .btn-target:hover {
            background: linear-gradient(135deg, #002855, #003f87);
        }

        .btn-report {
            background: linear-gradient(135deg, #0fa36e, #0c8459);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(15, 163, 110, 0.2);
        }

        .btn-report:hover {
            background: linear-gradient(135deg, #0a8256, #086643);
        }

        .icon {
            font-size: 1.3rem;
        }
        
        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #aab4bf;
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-placeholder"></div>
        <h1>Operations Gateway</h1>
        
        <!-- The Dynamic Wish Text goes here -->
        <div id="dynamic-wish">Welcome to your workspace!</div>

        <div class="btn-group">
            <!-- Button 1 links to the Target Portal (Ashutosh's Page) -->
            <a href="K1.html" class="nav-btn btn-target">
                <span class="icon">🎯</span> Target Portal (Elipoma)
            </a>

            <!-- Button 2 links to the Daily Report (Elipoma's Page) -->
            <a href="A1.html" class="nav-btn btn-report">
                <span class="icon">📊</span> Daily Report (Ashutosh)
            </a>
        </div>
        
        <div class="footer-text">Secure Branch Access &copy; 2024</div>
    </div>

    <!-- JavaScript for the Random Wishes -->
    <script>
        const wishes = [
            "Have a great day ahead! 🌟",
            "Keep up the excellent work! 💼",
            "Stay safe and stay productive! 🛡️",
            "Let's achieve our targets today! 🎯",
            "Welcome back to the workspace! 👋",
            "Wishing you a successful day! 🚀",
            "Your efforts make a difference! 💡"
        ];

        const wishElement = document.getElementById('dynamic-wish');
        
        // Function to change the wish with a smooth fade effect
        function changeWish() {
            // Fade out
            wishElement.style.opacity = 0;
            
            setTimeout(() => {
                // Pick a random wish from the list
                const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
                wishElement.textContent = randomWish;
                
                // Fade back in
                wishElement.style.opacity = 1;
            }, 500); // Wait half a second before changing text to allow fade out
        }

        // Change the wish every 4.5 seconds
        setInterval(changeWish, 4500);

        // Run once immediately on load to pick the first random wish
        window.onload = () => {
            const initialWish = wishes[Math.floor(Math.random() * wishes.length)];
            wishElement.textContent = initialWish;
        };
    </script>

</body>
</html>
