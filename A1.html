<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI Bank Ops - Target Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --p:  #002855; --pm: #003d80; --pl: #0a4fa6;
  --ac: #f0b400;
  --bg: #eef2f7;
  --ok: #0fa36e;
  --er: #e03434;
  --tm: #6b7b91;
  --bd: #dce5ef;
  --r:  16px; --rs: 10px;
  --sh: 0 4px 20px rgba(0,40,85,.10);
  --shh:0 8px 32px rgba(0,40,85,.18);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'DM Sans', sans-serif;
  margin: 0; background: var(--bg);
  padding-bottom: 40px; min-height: 100vh;
  background-image: radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,61,128,.12) 0%, transparent 70%);
}

/* HEADER */
header {
  background: linear-gradient(135deg, var(--p), var(--pm));
  color: #fff; padding: 13px 20px;
  border-bottom: 3px solid var(--ac);
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 4px 24px rgba(0,40,85,.35);
  position: sticky; top: 0; z-index: 100;
}
.brand { font-weight: 700; font-size: .95rem; letter-spacing: .5px; display: flex; align-items: center; gap: 9px; }
.brand::before {
  content: ''; width: 9px; height: 9px;
  background: var(--ac); border-radius: 50%; box-shadow: 0 0 8px var(--ac);
}
#live-clock {
  font-family: 'DM Mono', monospace; font-size: .82rem;
  color: rgba(255,255,255,.75); letter-spacing: 1px;
  background: rgba(255,255,255,.08); padding: 5px 11px;
  border-radius: 20px; border: 1px solid rgba(255,255,255,.12);
}

/* LAYOUT */
#main-content { padding: 18px 14px; max-width: 500px; margin: auto; }
.hidden { display: none !important; }

/* LOGIN */
#login-page { text-align: center; padding-top: 90px; animation: fadeUp .5s ease both; }
#login-page h2 { color: var(--p); font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -.3px; }
#login-page p  { color: var(--tm); font-size: .85rem; margin-bottom: 28px; }
#login-page .btn-primary { width: 150px; font-size: .95rem; padding: 13px; }

.login-info-box { font-size: .74rem; color: var(--tm); text-align: right; margin-bottom: 10px; }

/* GRID + CARDS */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.card {
  background: #fff; padding: 16px 12px 14px;
  border-radius: var(--r); text-align: center;
  border-top: 3px solid var(--p);
  box-shadow: var(--sh);
  transition: box-shadow .25s, transform .2s;
  position: relative; overflow: hidden;
  animation: fadeUp .45s ease both;
}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.10s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.20s}
.card:nth-child(5){animation-delay:.25s}
.card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--pl), var(--ac));
  opacity: 0; transition: opacity .3s;
}
.card:hover { box-shadow: var(--shh); transform: translateY(-2px); }
.card:hover::after { opacity: 1; }
.card.met { border-top-color: var(--ok); }
.card.met .count { color: var(--ok); }

/* Channel Migration card spans full width */
.card.full-width { grid-column: 1 / -1; }

.card h3 {
  margin: 0; font-size: .82rem; font-weight: 600; color: var(--tm);
  height: 34px; display: flex; align-items: center; justify-content: center;
  letter-spacing: .3px; text-transform: uppercase;
}
.target-label { font-size: .64rem; color: #aab4bf; display: block; margin-top: 1px; font-weight: 500; letter-spacing: .5px; }
.count {
  font-size: 2rem; font-weight: 700; margin: 8px 0 4px;
  color: var(--p); font-family: 'DM Mono', monospace; line-height: 1;
}
.count.pop { animation: countPop .3s ease; }

.pb-wrap { width: 100%; height: 4px; background: #e8eef4; border-radius: 99px; margin: 6px 0 10px; overflow: hidden; }
.pb-fill  { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--pl), var(--ac)); transition: width .5s cubic-bezier(.4,0,.2,1); }

/* BUTTONS — base */
button {
  padding: 9px 10px; border: none; border-radius: var(--rs);
  font-weight: 600; cursor: pointer; font-size: .78rem; width: 100%;
  transition: box-shadow .2s, transform .15s;
  letter-spacing: .3px; font-family: 'DM Sans', sans-serif;
}
button:active { transform: scale(.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--pl), var(--p));
  color: #fff; box-shadow: 0 2px 8px rgba(0,40,85,.20);
}
.btn-primary:hover { background: linear-gradient(135deg,#1060b8,var(--pm)); box-shadow: 0 4px 14px rgba(0,40,85,.30); }

.btn-target-met {
  background: linear-gradient(135deg,#0fa36e,#0c8459) !important;
  color: #fff !important; box-shadow: 0 2px 10px rgba(15,163,110,.30) !important;
}

/* Shared action buttons */
.btn-action {
  margin-top: 10px; padding: 12px; font-size: .85rem; color: #fff;
}
.btn-pdf { background: linear-gradient(135deg,#0fa36e,#0c8459); box-shadow: 0 3px 12px rgba(15,163,110,.25); margin-top: 16px; }
.btn-pdf:hover  { box-shadow: 0 5px 20px rgba(15,163,110,.35); }
.btn-wa  { background: linear-gradient(135deg,#25D366,#1aab52); box-shadow: 0 3px 12px rgba(37,211,102,.25); }
.btn-wa:hover   { box-shadow: 0 5px 20px rgba(37,211,102,.35); }
.btn-reset {
  background: transparent; color: var(--er); margin-top: 10px;
  font-size: .7rem; padding: 7px;
  border: 1px solid rgba(224,52,52,.25); border-radius: var(--rs);
}
.btn-reset:hover { background: rgba(224,52,52,.06); border-color: var(--er); }

/* Channel Migration button accent */
.btn-cm {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: #fff; box-shadow: 0 2px 8px rgba(124,58,237,.25);
}
.btn-cm:hover { box-shadow: 0 4px 14px rgba(124,58,237,.38); }
.btn-cm.btn-target-met {
  background: linear-gradient(135deg,#0fa36e,#0c8459) !important;
}

/* DIVIDER */
.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 0 4px; color: #aab4bf;
  font-size: .7rem; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

/* MODAL */
.modal {
  position: fixed; inset: 0;
  background: rgba(0,20,50,.75); backdrop-filter: blur(6px);
  display: flex; justify-content: center; align-items: center;
  z-index: 2000; padding: 20px;
}
.modal-box {
  background: #fff; padding: 26px 22px 20px;
  border-radius: 20px; width: 100%; max-width: 320px;
  box-shadow: 0 20px 60px rgba(0,20,60,.35);
  animation: modalIn .28s cubic-bezier(.34,1.56,.64,1) both;
}
.modal-box h4 { margin: 0 0 16px; font-size: 1rem; font-weight: 700; color: #0d1b2e; }

/* TOGGLE */
.toggle-wrap { display: flex; gap: 6px; margin-bottom: 16px; background: #f0f4f8; padding: 4px; border-radius: 10px; }
.toggle-btn {
  background: transparent; color: var(--tm); flex: 1; border: none;
  padding: 8px; border-radius: 7px; font-size: .75rem; font-weight: 600;
  transition: all .2s; box-shadow: none; width: auto;
}
.toggle-btn.active { background: var(--p); color: #fff; box-shadow: 0 2px 8px rgba(0,40,85,.22); }

/* INPUT */
#val-field {
  width: 100%; padding: 13px 14px; margin-bottom: 16px;
  border: 1.5px solid var(--bd); border-radius: var(--rs);
  font-size: 1rem; font-family: 'DM Mono', monospace; color: #0d1b2e;
  background: #f8fafc; outline: none; transition: border-color .2s, box-shadow .2s;
}
#val-field:focus { border-color: var(--pl); box-shadow: 0 0 0 3px rgba(10,79,166,.12); background: #fff; }

.btn-cancel { background: none; color: var(--tm); border: none; box-shadow: none; margin-top: 8px; font-size: .78rem; padding: 6px; }
.btn-cancel:hover { color: #0d1b2e; background: #f0f4f8; }

/* ANIMATIONS */
#dashboard { animation: fadeUp .4s ease both; }
@keyframes fadeUp   { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
@keyframes countPop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
@keyframes modalIn  { from { opacity:0; transform:scale(.88) translateY(16px) } to { opacity:1; transform:none } }
</style>
</head>
<body>

<header>
  <div class="brand">SBI BANK &nbsp;Jlqshf84</div>
  <div id="live-clock">00:00:00</div>
</header>

<div id="main-content">

  <div id="login-page">
    <h2>Operations Portal</h2>
    <p>SBI Bank — Secure Branch Access</p>
    <button class="btn-primary btn-action" style="width:150px" onclick="doLogin()">Login</button>
  </div>

  <div id="dashboard" class="hidden">
    <div id="login-ts" class="login-info-box"></div>

    <div class="grid">
      <div class="card" id="card-nps">
        <h3>NPS</h3><span class="target-label">Target: 10</span>
        <div class="count" id="c-nps">0</div>
        <div class="pb-wrap"><div class="pb-fill" id="pb-nps"></div></div>
        <button id="btn-nps" class="btn-primary" onclick="addSimple('NPS')">Add</button>
      </div>
      <div class="card" id="card-wa">
        <h3>WhatsApp</h3><span class="target-label">Target: 15</span>
        <div class="count" id="c-wa">0</div>
        <div class="pb-wrap"><div class="pb-fill" id="pb-wa"></div></div>
        <button id="btn-wa" class="btn-primary" onclick="openModal('WhatsApp')">Action</button>
      </div>
      <div class="card" id="card-yono">
        <h3>Yono SBI</h3><span class="target-label">Target: 5</span>
        <div class="count" id="c-yono">0</div>
        <div class="pb-wrap"><div class="pb-fill" id="pb-yono"></div></div>
        <button id="btn-yono" class="btn-primary" onclick="openModal('Yono SBI')">Action</button>
      </div>
      <div class="card" id="card-contact">
        <h3>Contact Centre</h3><span class="target-label">Target: 10</span>
        <div class="count" id="c-contact">0</div>
        <div class="pb-wrap"><div class="pb-fill" id="pb-contact"></div></div>
        <button id="btn-contact" class="btn-primary" onclick="openModal('Contact Centre')">Action</button>
      </div>

      <!-- ✅ NEW: Channel Migration card — full width, purple accent -->
      <div class="card full-width" id="card-cm">
        <h3>Channel Migration</h3><span class="target-label">Target: 10</span>
        <div class="count" id="c-cm">0</div>
        <div class="pb-wrap"><div class="pb-fill" id="pb-cm" style="background: linear-gradient(90deg,#7c3aed,#a78bfa);"></div></div>
        <button id="btn-cm" class="btn-cm" onclick="addSimple('Channel Migration')">Add</button>
      </div>
    </div>

    <div class="divider">Actions</div>
    <button class="btn-action btn-pdf"   onclick="generatePDF()">Download PDF &amp; Reset</button>
    <button class="btn-action btn-wa"    onclick="shareWA()">Share via WhatsApp</button>
    <button class="btn-reset"            onclick="resetApp()">Manual Reset</button>
  </div>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h4 id="modal-title">Entry Details</h4>
    <div class="toggle-wrap">
      <button id="t-acc" class="toggle-btn active" onclick="setType('Account Number')">Account</button>
      <button id="t-mob" class="toggle-btn"        onclick="setType('Mobile Number')">Mobile</button>
    </div>
    <input type="number" id="val-field" placeholder="Enter Digits">
    <button class="btn-primary" onclick="saveEntry()">Save</button>
    <button class="btn-cancel"  onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

// ── CONFIG ──────────────────────────────────────────────
const TARGETS = {
  NPS: 10,
  WhatsApp: 15,
  'Yono SBI': 5,
  'Contact Centre': 10,
  'Channel Migration': 10   // ✅ NEW
};

const MAP = [
  { key:'NPS',               id:'nps'     },
  { key:'WhatsApp',          id:'wa'      },
  { key:'Yono SBI',          id:'yono'    },
  { key:'Contact Centre',    id:'contact' },
  { key:'Channel Migration', id:'cm'      }   // ✅ NEW
];

// ── STATE ───────────────────────────────────────────────
let state = JSON.parse(localStorage.getItem('sbi_v14')) || {
  counts: {
    NPS: 0,
    WhatsApp: 0,
    'Yono SBI': 0,
    'Contact Centre': 0,
    'Other Forms': 0,
    'Channel Migration': 0   // ✅ NEW
  },
  logs: [], loginTime: null,
  brName:'SBI KOMTALPETA', brCode:'17978', userName:'ASHUTOSH PATTNAIK'
};

// Ensure Channel Migration key exists in old saved states
if (state.counts['Channel Migration'] === undefined) {
  state.counts['Channel Migration'] = 0;
}

let activeCat = '', selType = 'Account Number';

// ── CACHE DOM ───────────────────────────────────────────
const $ = id => document.getElementById(id);
const els = {};
MAP.forEach(({ key, id }) => {
  els[key] = { count: $('c-'+id), pb: $('pb-'+id), btn: $('btn-'+id), card: $('card-'+id) };
});

// ── CLOCK ───────────────────────────────────────────────
setInterval(() => $('live-clock').textContent = new Date().toLocaleTimeString(), 1000);

// ── AUTH ────────────────────────────────────────────────
function doLogin() {
  if (!state.loginTime) state.loginTime = new Date().toLocaleTimeString();
  $('login-page').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('login-ts').textContent = 'Logged in at: ' + state.loginTime;
  save();
}

// ── DATA ────────────────────────────────────────────────
function addSimple(cat) {
  state.counts[cat]++;
  state.logs.push({ id: state.logs.length+1, cat, val:'Incremented by 1', time: new Date().toLocaleTimeString() });
  save();
}

function openModal(cat) {
  activeCat = cat;
  $('modal-title').textContent = cat + ' Entry';
  $('val-field').value = '';
  setType('Account Number');
  $('modal').classList.remove('hidden');
  setTimeout(() => $('val-field').focus(), 100);
}

function setType(type) {
  selType = type;
  $('t-acc').classList.toggle('active', type === 'Account Number');
  $('t-mob').classList.toggle('active', type === 'Mobile Number');
  $('val-field').placeholder = 'Enter ' + type;
}

function saveEntry() {
  const val = $('val-field').value;
  if (!val) return alert('Please enter digits');
  state.counts[activeCat]++;
  state.logs.push({ id: state.logs.length+1, cat:`${activeCat} (${selType})`, val, time: new Date().toLocaleTimeString() });
  save(); closeModal();
}

function closeModal() { $('modal').classList.add('hidden'); }

function save() {
  localStorage.setItem('sbi_v14', JSON.stringify(state));
  refreshUI();
}

// ── UI ──────────────────────────────────────────────────
function refreshUI() {
  MAP.forEach(({ key }) => {
    const count = state.counts[key];
    const e = els[key];
    const prev = parseInt(e.count.textContent) || 0;
    e.count.textContent = count;
    if (count !== prev) {
      e.count.classList.remove('pop');
      void e.count.offsetWidth;
      e.count.classList.add('pop');
    }
    e.pb.style.width = Math.min(100, Math.round(count / TARGETS[key] * 100)) + '%';
    const met = count >= TARGETS[key];
    e.btn.classList.toggle('btn-target-met', met);
    e.card.classList.toggle('met', met);
  });
}

// ── PDF ─────────────────────────────────────────────────
function generatePDF() {
  const doc = new jsPDF();
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB');

  doc.setFontSize(16); doc.setTextColor(0, 51, 102);
  doc.text('SBI BANK SUMMARY REPORT', 14, 15);
  doc.setFontSize(10); doc.setTextColor(100);
  doc.text(`Login Time: ${state.loginTime || 'N/A'}`, 14, 22);
  doc.text(`Date: ${dateStr}`, 14, 27);

  // ✅ Summary table includes Channel Migration
  doc.autoTable({
    startY: 32,
    head: [['Category', 'Count', 'Target']],
    body: [
      ['NPS',               state.counts['NPS'],               TARGETS['NPS']],
      ['WhatsApp',          state.counts['WhatsApp'],          TARGETS['WhatsApp']],
      ['Yono SBI',          state.counts['Yono SBI'],          TARGETS['Yono SBI']],
      ['Contact Centre',    state.counts['Contact Centre'],    TARGETS['Contact Centre']],
      ['Channel Migration', state.counts['Channel Migration'], TARGETS['Channel Migration']],  // ✅ NEW
    ],
    headStyles: { fillColor: [0, 51, 102] },
    theme: 'grid'
  });

  // Detailed log table
  const afterSummary = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(12); doc.setTextColor(0, 51, 102);
  doc.text('Detailed Log', 14, afterSummary);

  doc.autoTable({
    startY: afterSummary + 4,
    head: [['S.No', 'Details (Action Time)', 'Value / Action']],
    body: state.logs.map(l => [l.id, `${l.cat} [${l.time}]`, l.val]),
    headStyles: { fillColor: [0, 51, 102] }, theme: 'grid'
  });

  doc.save(`SB_${dateStr.replace(/\//g,'_')}.pdf`);
  setTimeout(() => { localStorage.clear(); alert('Report Saved. App will reset.'); location.reload(); }, 1500);
}

// ── SHARE ────────────────────────────────────────────────
function shareWA() {
  const c = state.counts;
  const msg =
    `*Date:* ${new Date().toLocaleDateString()}\n` +
    `*Branch Name:* "${state.brName}"\n` +
    `*Branch Code:* "${state.brCode}"\n` +
    `*Name:* "${state.userName}"\n\n` +
    `NPS: ${c.NPS}\nWhatsApp: ${c.WhatsApp}\n` +
    `Yono SBI Registration: ${c['Yono SBI']}\n` +
    `Contact Centre: ${c['Contact Centre']}\n` +
    `Channel Migration: ${c['Channel Migration']}\n` +   // ✅ NEW
    `Other Forms: ${25 + (c['Other Forms'] || 0)}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function resetApp() { if (confirm('Manual Override: Wipe all data?')) { localStorage.clear(); location.reload(); } }

window.onload = () => { if (state.loginTime) doLogin(); };
</script>
</body>
</html>
